[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "drm-core"
version = "0.4.0"
description = "Python core for the DRM Fortran 2018 rotor dynamics solver"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]
[project.scripts]
drm-cli = "drm_core.cli.main:main"
[tool.setuptools.packages.find]
where=["src"]
