name: Flet toolchain bootstrap (not qualification)
on:
  push:
    branches: [feat/flet-mockup-interface-20260929]
    paths: [.github/workflows/flet-toolchain-bootstrap.yml]
permissions:
  contents: read
jobs:
  toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Obtain client system library (not project qualification)
        run: |
          mkdir runtime
          cd runtime
          apt-get download libsecret-1-0
          sha256sum *.deb > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: flet-linux-system-dependency
          path: runtime
          retention-days: 7
