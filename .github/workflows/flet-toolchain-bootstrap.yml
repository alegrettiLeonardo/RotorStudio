name: Flet toolchain bootstrap (not qualification)
on:
  push:
    branches: [feat/flet-mockup-interface-20260929]
    paths: [.github/workflows/flet-toolchain-bootstrap.yml]
permissions:
  contents: read
jobs:
  toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Obtain official Flet desktop runtime (not project qualification)
        run: |
          mkdir runtime
          curl --fail --location --retry 3 https://github.com/flet-dev/flet/releases/download/v1.0.0/flet-linux-ubuntu24.04-light-amd64.tar.gz -o runtime/flet-linux-ubuntu24.04-light-amd64.tar.gz
          sha256sum runtime/* > runtime/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: flet-1.0.0-desktop-runtime-linux
          path: runtime
          retention-days: 7
