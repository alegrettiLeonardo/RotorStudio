name: Stage 2 Desktop UI M1

on:
  push:
    branches:
      - feature/stage2-desktop-ui
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: stage2-ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-m1-linux:
    name: PySide6 shell + Example_05_08_01 real-Fortran vertical slice
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: ${{ github.workspace }}/python/src:${{ github.workspace }}
      DRMROTOR_LIB: ${{ github.workspace }}/build-stage2/libdrmrotor.so
    steps:
      - uses: actions/checkout@v4

      - name: Install numerical and Qt runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y             gfortran cmake libblas-dev liblapack-dev             libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install Core + Stage 2 UI test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './python[test,studio,ui-test]'

      - name: Build qualified Fortran core
        run: |
          cmake -S fortran -B build-stage2 -DCMAKE_BUILD_TYPE=Release
          cmake --build build-stage2 -j2
          ctest --test-dir build-stage2 --output-on-failure

      - name: Assert frozen Stage 1 Python test count
        run: |
          set -o pipefail
          python -m pytest python/tests --collect-only -q             | tee validation/reports/STAGE2_STAGE1_COLLECTION.txt
          grep -Eq '57 tests collected|57 collected' validation/reports/STAGE2_STAGE1_COLLECTION.txt

      - name: Stage 1 Python regression
        run: |
          set -o pipefail
          python -m pytest python/tests -q             | tee validation/reports/STAGE2_STAGE1_REGRESSION.txt

      - name: Stage 2 UI unit and behavior tests
        run: |
          set -o pipefail
          python -m pytest             python/tests_ui/test_ui_core_boundary.py             python/tests_ui/test_ui_model_editing.py             -q | tee validation/reports/STAGE2_UI_TESTS.txt

      - name: M1 Example_05_08_01 end-to-end with real Fortran
        run: |
          set -o pipefail
          python -m pytest python/tests_ui/test_ui_e2e_modal.py -q             | tee validation/reports/STAGE2_M1_E2E.txt
          if grep -qi 'skipped' validation/reports/STAGE2_M1_E2E.txt; then
            echo 'M1 must not be skipped in qualification' >&2
            exit 1
          fi

      - name: Capture real Stage 2 application screenshots
        run: |
          python scripts/capture_stage2_ui.py             --outdir validation/reports/stage2_screenshots

      - name: Record M1 Linux evidence
        run: |
          python - <<'PY'
          import json, os, pathlib
          out = {
              "schema_version": 1,
              "head_sha": os.environ["GITHUB_SHA"],
              "platform": "ubuntu-24.04",
              "fortran_ctest": "PASS",
              "stage1_python_tests": "57/57 PASS",
              "stage2_ui_tests": "PASS",
              "example_05_08_01_modal_e2e": "PASS",
              "backend": "Fortran2018/ctypes",
              "qt_platform": os.environ.get("QT_QPA_PLATFORM"),
              "screenshots": [
                  "stage2_screenshots/rotor_model.png",
                  "stage2_screenshots/modal_results.png",
              ],
          }
          pathlib.Path("validation/reports/STAGE2_M1_LINUX.json").write_text(
              json.dumps(out, indent=2, sort_keys=True)
          )
          print(json.dumps(out, indent=2, sort_keys=True))
          PY

      - name: Upload Stage 2 M1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage2-ui-m1-${{ github.sha }}
          path: |
            validation/reports/STAGE2_STAGE1_COLLECTION.txt
            validation/reports/STAGE2_STAGE1_REGRESSION.txt
            validation/reports/STAGE2_UI_TESTS.txt
            validation/reports/STAGE2_M1_E2E.txt
            validation/reports/STAGE2_M1_LINUX.json
            validation/reports/stage2_screenshots/
          if-no-files-found: warn
          retention-days: 90
