name: ROSS Analysis A0 Reference Qualification
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authority:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Preserve authority source bytes on Windows
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
        with:
          repository: petrobras/ross
          ref: 6320eab9f890f1b3cc1710d508b446fe063ca68d
          path: _ross_authority
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation-only dependencies
        run: python -m pip install -e ./_ross_authority pytest
      - name: Verify checked-in reference and invariants
        run: python -m pytest validation/ross_parity/tests -q
      - name: Generate into separate immutable candidate directory
        run: python validation/ross_parity/generate_reference.py --ross-root _ross_authority --out _ross_candidate
      - name: Compare pinned ROSS reproduction
        run: python validation/ross_parity/verify_reference.py validation/ross_parity/static --candidate _ross_candidate
      - name: Reproduce separate A1 authorities
        run: |
          python validation/ross_parity/generate_static_reference.py --ross-root _ross_authority --out _ross_static_candidate
          python validation/ross_parity/verify_reference.py validation/ross_parity/static_extended --candidate _ross_static_candidate
      - name: Reproduce immutable 4-DOF A2 authorities
        run: |
          python validation/ross_parity/generate_frf_reference.py --ross-root _ross_authority --out _ross_frf_candidate
          python validation/ross_parity/verify_reference.py validation/ross_parity/frf --candidate _ross_frf_candidate
      - name: Reproduce immutable 4-DOF A3 authorities
        run: |
          python validation/ross_parity/generate_forced_reference.py --ross-root _ross_authority --out _ross_forced_candidate
          python validation/ross_parity/verify_reference.py validation/ross_parity/forced --candidate _ross_forced_candidate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ross-a0-${{ matrix.os }}-${{ github.sha }}
          path: _ross_candidate
          if-no-files-found: error
