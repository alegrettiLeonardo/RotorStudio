name: iRdin I5 Bearing Policy Qualification

on:
  push:
    branches: [feature/irdin-api541-dynamics]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Preserve numerical authority bytes
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure Python path on Linux
        if: runner.os == 'Linux'
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE/python/src:$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Configure Python path on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $value = "$env:GITHUB_WORKSPACE\python\src;$env:GITHUB_WORKSPACE"
          "PYTHONPATH=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install Python dependencies
        run: |
          python -m pip install -e "./python[test]"
          python -m pip check
      - name: Linux build
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gfortran libblas-dev liblapack-dev
          cmake -S fortran -B build-i5 -DCMAKE_BUILD_TYPE=Release
          cmake --build build-i5 --parallel 2
          ctest --test-dir build-i5 --output-on-failure
          echo "DRMROTOR_LIB=${{ github.workspace }}/build-i5/libdrmrotor.so" >> "$GITHUB_ENV"
          echo "DRMBEARINGS_LIB=${{ github.workspace }}/build-i5/libdrmbearings.so" >> "$GITHUB_ENV"
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc-fortran mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-openblas
      - name: Windows build
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cmake -S fortran -B build-i5 -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_Fortran_COMPILER=/ucrt64/bin/gfortran.exe -DCMAKE_PREFIX_PATH=/ucrt64 -DBLA_VENDOR=OpenBLAS
          cmake --build build-i5 --parallel 2
          ctest --test-dir build-i5 --output-on-failure
          echo "DRMROTOR_LIB=$(cygpath -w "$PWD/build-i5/libdrmrotor.dll")" >> "$GITHUB_ENV"
          echo "DRMBEARINGS_LIB=$(cygpath -w "$PWD/build-i5/libdrmbearings.dll")" >> "$GITHUB_ENV"
          echo "DRMROTOR_DLL_DIRS=$(cygpath -w /ucrt64/bin)" >> "$GITHUB_ENV"
          echo "DRMBEARINGS_DLL_DIRS=$(cygpath -w /ucrt64/bin)" >> "$GITHUB_ENV"
          cygpath -w /ucrt64/bin >> "$GITHUB_PATH"
      - name: Immutable source authority
        run: python validation/irdin/i0_authority.py --verify
      - name: I5 policy and bearing regressions
        run: >-
          python -m pytest
          python/tests_irdin/test_i5_bearing_policy.py
          python/tests_bearings
          python/tests
          -q
          --junitxml=irdin-i5-${{ runner.os }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: irdin-i5-${{ runner.os }}-${{ github.sha }}
          path: irdin-i5-${{ runner.os }}.xml
          if-no-files-found: error
          retention-days: 30
