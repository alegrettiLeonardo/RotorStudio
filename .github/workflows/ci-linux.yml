name: Linux qualification

on:
  push:
    branches:
      - main
      - feature/stage1-m7-reproducible-qualification
  pull_request:
    branches:
      - main

jobs:
  linux-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran cmake libblas-dev liblapack-dev

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install Python qualification dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e './python[test]'

      - name: Verify V2 authority source integrity
        run: python validation/authority/verify_v2_authority.py

      - name: Build and test Fortran Release
        run: |
          cmake -S fortran -B build-release -DCMAKE_BUILD_TYPE=Release
          cmake --build build-release -j2
          ctest --test-dir build-release --output-on-failure

      - name: Build and test Fortran Debug
        run: |
          cmake -S fortran -B build-debug -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-debug -j2
          ctest --test-dir build-debug --output-on-failure

      - name: Python test suite
        env:
          PYTHONPATH: ${{ github.workspace }}/python/src:${{ github.workspace }}
          DRMROTOR_LIB: ${{ github.workspace }}/build-release/libdrmrotor.so
        run: python -m pytest python/tests -q

      - name: 22-example campaign
        env:
          PYTHONPATH: ${{ github.workspace }}/python/src:${{ github.workspace }}
          DRMROTOR_LIB: ${{ github.workspace }}/build-release/libdrmrotor.so
        run: |
          python scripts/run_example_campaign.py --outdir validation/reports/example_campaign_ci
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("validation/reports/example_campaign_ci/campaign_summary.json")
          d=json.loads(p.read_text())
          expected={"runs":33,"pass":33,"blocked":0,"fail":0,"unique_examples":22}
          actual={k:d[k] for k in expected}
          print("campaign",actual)
          if actual!=expected:
              raise SystemExit(f"campaign mismatch: expected={expected} actual={actual}")
          PY

      - name: Upload Linux qualification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-qualification-${{ github.sha }}
          path: |
            validation/reports/example_campaign_ci/
