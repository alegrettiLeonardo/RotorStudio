name: ROSS Analysis A3 Forced Response Qualification
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-forced-response:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y gfortran cmake libblas-dev liblapack-dev libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc-fortran mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-openblas
      - name: Python dependencies
        run: python -m pip install -e "./python[test,studio,ui-test]"
      - name: Preserve legacy implementation
        run: python scripts/verify_a1_legacy_preservation.py
      - name: Linux Release
        if: runner.os == 'Linux'
        run: |
          cmake -S fortran -B build-static -DCMAKE_BUILD_TYPE=Release
          cmake --build build-static -j2
          ctest --test-dir build-static --output-on-failure
          echo "DRMROTOR_LIB=$PWD/build-static/libdrmrotor.so" >> "$GITHUB_ENV"
          echo "DRMBEARINGS_LIB=$PWD/build-static/libdrmbearings.so" >> "$GITHUB_ENV"
          echo "PYTHONPATH=$PWD/python/src:$PWD" >> "$GITHUB_ENV"
      - name: Windows Release
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake -S fortran -B build-static -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_Fortran_COMPILER=/ucrt64/bin/gfortran.exe -DCMAKE_PREFIX_PATH=/ucrt64 -DBLA_VENDOR=OpenBLAS
          cmake --build build-static --parallel
          ctest --test-dir build-static --output-on-failure
          echo "DRMROTOR_DLL_DIRS=$(cygpath -w /ucrt64/bin)" >> "$GITHUB_ENV"
          echo "DRMBEARINGS_DLL_DIRS=$(cygpath -w /ucrt64/bin)" >> "$GITHUB_ENV"
      - name: Windows library paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dll = Get-ChildItem build-static -Recurse -Filter '*drmrotor*.dll' | Select-Object -First 1
          $bearing = Get-ChildItem build-static -Recurse -Filter '*drmbearings*.dll' | Select-Object -First 1
          "DRMROTOR_LIB=$($dll.FullName)" >> $env:GITHUB_ENV
          "DRMBEARINGS_LIB=$($bearing.FullName)" >> $env:GITHUB_ENV
          "PYTHONPATH=$PWD\python\src;$PWD" >> $env:GITHUB_ENV
      - name: Immutable authorities
        run: |
          python validation/ross_parity/verify_reference.py validation/ross_parity/static
          python validation/ross_parity/verify_reference.py validation/ross_parity/static_extended
          python validation/ross_parity/verify_reference.py validation/ross_parity/frf
          python validation/ross_parity/verify_reference.py validation/ross_parity/forced
      - name: Native ABI, M/K/load parity, service, persistence, GUI and regressions
        run: python -m pytest python/tests_forced python/tests_frf python/tests_static python/tests -q
      - name: Numerical evidence and conditioning
        run: python validation/ross_parity/qualify_forced_response.py --out validation/reports/a3_forced_response_ci.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a3-forced-response-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: validation/reports/a3_forced_response_ci.json
          if-no-files-found: error
