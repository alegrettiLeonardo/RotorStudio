name: Freeze A8 Clearance ROSS Authority

on:
  push:
    branches: [feature/ross-analysis-a8-clearance]

permissions:
  contents: write

jobs:
  freeze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ross-analysis-a8-clearance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refuse authority overwrite
        id: gate
        shell: bash
        run: |
          if [ -f validation/ross_parity/clearance/authority.json ]; then
            echo "freeze_needed=false" >> "$GITHUB_OUTPUT"
            echo "A8 authority already exists."
          else
            echo "freeze_needed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout exact frozen ROSS
        shell: bash
        run: |
          git clone https://github.com/petrobras/ross.git _ross_authority
          git -C _ross_authority checkout 6320eab9f890f1b3cc1710d508b446fe063ca68d
          test "$(git -C _ross_authority rev-parse HEAD)" = "6320eab9f890f1b3cc1710d508b446fe063ca68d"
      - name: Install frozen ROSS validation runtime
        shell: bash
        run: |
          python -m pip install -e ./_ross_authority
          python -m pip install "numpy==1.26.4" "scipy==1.14.1"
      - name: Generate immutable A8 goldens once
        if: steps.gate.outputs.freeze_needed == 'true'
        run: |
          python validation/ross_parity/generate_clearance_reference.py \
            --ross-root _ross_authority \
            --out validation/ross_parity/clearance
      - name: Reproduce immutable A8 authority without overwrite
        if: steps.gate.outputs.freeze_needed == 'false'
        run: |
          python validation/ross_parity/generate_clearance_reference.py \
            --ross-root _ross_authority \
            --out _a8_clearance_candidate
          python validation/ross_parity/verify_clearance_candidate.py \
            validation/ross_parity/clearance _a8_clearance_candidate
      - name: Commit immutable A8 goldens
        if: steps.gate.outputs.freeze_needed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/ross_parity/clearance
          git diff --cached --exit-code && { echo "No goldens generated"; exit 1; } || true
          git commit -m "a8: freeze ROSS clearance goldens"
          git push origin HEAD:feature/ross-analysis-a8-clearance
