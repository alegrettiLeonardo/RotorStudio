name: Formal equivalence - Octave 7.1.0

on:
  push:
    branches:
      - main
      - feature/stage1-m7-reproducible-qualification
  pull_request:
    branches:
      - main

jobs:
  octave-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran cmake libblas-dev liblapack-dev

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install pinned Python qualification environment
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ./python
          python -m pip install             numpy==2.5.3             scipy==1.18.1             matplotlib==3.11.2             pytest==9.1.1

      - name: Verify V2 authority source integrity
        run: python validation/authority/verify_v2_authority.py

      - name: Build qualified Fortran Release
        run: |
          cmake -S fortran -B build-release -DCMAKE_BUILD_TYPE=Release
          cmake --build build-release -j2
          ctest --test-dir build-release --output-on-failure

      - name: Pull pinned Octave authority image
        run: docker pull gnuoctave/octave:7.1.0

      - name: Generate fresh Octave V2 authority baseline
        run: |
          rm -rf validation/baseline/ci_octave
          mkdir -p validation/baseline/ci_octave
          docker run --rm             -v "$PWD:/work"             -w /work             --entrypoint octave             gnuoctave/octave:7.1.0             --quiet --eval "addpath('/work/validation/equivalence/matlab'); generate_authority_baseline('/work','/work/validation/baseline/ci_octave','/work/reference/matlab_v2');"

      - name: Verify pinned authority engine
        run: |
          cat validation/baseline/ci_octave/MATLAB_AUTHORITY_METADATA.txt
          grep -Fx 'version=7.1.0' validation/baseline/ci_octave/MATLAB_AUTHORITY_METADATA.txt

      - name: Run G5-G12 formal equivalence
        env:
          PYTHONPATH: ${{ github.workspace }}/python/src:${{ github.workspace }}
          DRMROTOR_LIB: ${{ github.workspace }}/build-release/libdrmrotor.so
        run: |
          python validation/equivalence/run_formal_equivalence.py             --matlab-baseline validation/baseline/ci_octave/authority_baseline.mat             --transient-tolerances validation/baseline/octave_authority/TRANSIENT_TOLERANCES_M7.json             --output validation/reports/FORMAL_EQUIVALENCE_CI_M7.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("validation/reports/FORMAL_EQUIVALENCE_CI_M7.json")
          d=json.loads(p.read_text())
          print(json.dumps(d,indent=2))
          expected=[f"G{i}" for i in range(5,13)]
          bad={g:d["gates"].get(g) for g in expected if d["gates"].get(g,{}).get("status")!="PASS"}
          if d.get("overall")!="PASS" or bad:
              raise SystemExit(f"formal equivalence not closed: overall={d.get('overall')} bad={bad}")
          PY

      - name: Upload formal authority evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formal-equivalence-octave-7.1.0-${{ github.sha }}
          path: |
            validation/baseline/ci_octave/MATLAB_AUTHORITY_METADATA.txt
            validation/baseline/ci_octave/authority_baseline.mat
            validation/reports/FORMAL_EQUIVALENCE_CI_M7.json
            validation/reports/FORMAL_EQUIVALENCE_CI_M7.md
