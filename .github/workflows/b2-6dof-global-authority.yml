name: Reproduce B2 6DOF Global Authority

on:
  push:
    branches: [feature/ross-analysis-b2-6dof-global-modal-campbell]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONHASHSEED: '0'

jobs:
  candidate:
    name: B2 frozen authority reproduction / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Set deterministic Git bytes
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: petrobras/ross
          ref: 6320eab9f890f1b3cc1710d508b446fe063ca68d
          path: _ross_b2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen ROSS and test tools
        run: |
          python -m pip install -e ./_ross_b2 pytest
          python -m pip check
      - name: Reproduce frozen authority from real ROSS
        run: |
          python validation/ross_parity/generate_6dof_global_reference.py --ross-root _ross_b2 --out b2-evidence/candidate
          python validation/ross_parity/verify_6dof_global_candidate.py \
            --reference validation/ross_parity/6dof_global \
            --candidate b2-evidence/candidate \
            --report b2-evidence/frozen-reproduction.json
      - name: Authority tests
        run: python -m pytest validation/b2/tests -q --junitxml=b2-evidence/authority-tests.xml
      - name: Independent repeat
        run: |
          python validation/ross_parity/generate_6dof_global_reference.py --ross-root _ross_b2 --out b2-evidence/repeat
          python validation/ross_parity/verify_6dof_global_candidate.py \
            --reference b2-evidence/candidate \
            --candidate b2-evidence/repeat \
            --report b2-evidence/repeat-comparison.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b2-authority-${{ matrix.os }}-${{ github.sha }}
          path: b2-evidence/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    name: B2 frozen authority aggregate
    needs: candidate
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require both platforms
        env:
          RESULT: ${{ needs.candidate.result }}
        run: test "$RESULT" = success
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: b2-authority-*-${{ github.sha }}
          path: b2-platforms
      - name: Compare Linux and Windows candidates
        run: |
          python validation/ross_parity/verify_6dof_global_candidate.py \
            --reference "b2-platforms/b2-authority-ubuntu-24.04-${GITHUB_SHA}/candidate" \
            --candidate "b2-platforms/b2-authority-windows-2025-${GITHUB_SHA}/candidate" \
            --report b2-cross-platform.json
      - name: Verify Linux reproduction against immutable frozen authority
        run: |
          python validation/ross_parity/verify_6dof_global_candidate.py \
            --reference validation/ross_parity/6dof_global \
            --candidate "b2-platforms/b2-authority-ubuntu-24.04-${GITHUB_SHA}/candidate" \
            --report b2-linux-frozen-reproduction.json
      - name: Verify Windows reproduction against immutable frozen authority
        run: |
          python validation/ross_parity/verify_6dof_global_candidate.py \
            --reference validation/ross_parity/6dof_global \
            --candidate "b2-platforms/b2-authority-windows-2025-${GITHUB_SHA}/candidate" \
            --report b2-windows-frozen-reproduction.json
      - name: Assert frozen authority remains byte-identical and unmodified
        run: |
          git diff --exit-code d9be588c71bfd7116f61d1f5f5be3a2ee0e06726 HEAD -- validation/ross_parity/6dof_global
          test -z "$(git status --porcelain --untracked-files=all validation/ross_parity/6dof_global)"
      - uses: actions/upload-artifact@v4
        with:
          name: b2-authority-aggregate-${{ github.sha }}
          path: |
            b2-cross-platform.json
            b2-linux-frozen-reproduction.json
            b2-windows-frozen-reproduction.json
          if-no-files-found: error
          retention-days: 90
