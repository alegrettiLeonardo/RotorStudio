name: Stage 1 M7 Qualification

on:
  push:
    branches:
      - main
      - feature/stage1-m7-ci-qualification-closure
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: m7-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-release:
    name: Linux Release + Python + examples
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install numerical toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gfortran cmake libblas-dev liblapack-dev

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install Python qualification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './python[test]'

      - name: Verify frozen V2 authority sources
        run: |
          set -o pipefail
          python validation/equivalence/verify_authority_sources.py \
            | tee validation/reports/authority_source_integrity_M7.json

      - name: Build Fortran Release
        run: |
          cmake -S fortran -B build-release -DCMAKE_BUILD_TYPE=Release
          cmake --build build-release -j2
          ctest --test-dir build-release --output-on-failure

      - name: Run Python qualification suite
        env:
          PYTHONPATH: ${{ github.workspace }}/python/src:${{ github.workspace }}
          DRMROTOR_LIB: ${{ github.workspace }}/build-release/libdrmrotor.so
        run: |
          set -o pipefail
          python -m pytest python/tests -q \
            | tee validation/reports/pytest_M7.txt

      - name: Run 22-example campaign
        env:
          PYTHONPATH: ${{ github.workspace }}/python/src:${{ github.workspace }}
          DRMROTOR_LIB: ${{ github.workspace }}/build-release/libdrmrotor.so
        run: |
          set -o pipefail
          python scripts/run_example_campaign.py \
            --outdir validation/reports/example_campaign_M7 \
            | tee validation/reports/example_campaign_M7.txt

      - name: Upload Linux Release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m7-linux-release-${{ github.sha }}
          path: |
            validation/reports/authority_source_integrity_M7.json
            validation/reports/pytest_M7.txt
            validation/reports/example_campaign_M7*
          if-no-files-found: warn
          retention-days: 90

  linux-debug:
    name: Linux Debug runtime checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install numerical toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gfortran cmake libblas-dev liblapack-dev

      - name: Build and test Fortran Debug
        run: |
          cmake -S fortran -B build-debug -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-debug -j2
          ctest --test-dir build-debug --output-on-failure

  formal-octave-7-1:
    name: Frozen Octave 7.1.0 formal G5-G12
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install host numerical toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gfortran cmake libblas-dev liblapack-dev

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install Python qualification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './python[test]'

      - name: Verify frozen V2 authority sources
        run: |
          mkdir -p validation/reports/m7_ci
          set -o pipefail
          python validation/equivalence/verify_authority_sources.py \
            | tee validation/reports/m7_ci/authority_source_integrity.json

      - name: Build Fortran Release for formal comparison
        run: |
          cmake -S fortran -B build-formal -DCMAKE_BUILD_TYPE=Release
          cmake --build build-formal -j2
          ctest --test-dir build-formal --output-on-failure

      - name: Generate independent transient source references
        env:
          PYTHONPATH: ${{ github.workspace }}/python/src:${{ github.workspace }}
          DRMROTOR_LIB: ${{ github.workspace }}/build-formal/libdrmrotor.so
        run: |
          python validation/baseline/transient/generate_source_baseline.py
          set -o pipefail
          sha256sum validation/baseline/transient/*_source_reference.npz \
            | tee validation/reports/m7_ci/source_reference_hashes.sha256

      - name: Pull pinned Octave 7.1.0 authority runtime
        run: |
          docker pull gnuoctave/octave:7.1.0
          set -o pipefail
          docker image inspect gnuoctave/octave:7.1.0 \
            --format '{{index .RepoDigests 0}}' \
            | tee validation/reports/m7_ci/octave_container_digest.txt

      - name: Generate V2 authority baseline with Octave 7.1.0
        run: |
          mkdir -p validation/reports/m7_ci/authority
          docker run --rm             -v "${GITHUB_WORKSPACE}:/work"             -w /work             gnuoctave/octave:7.1.0             octave --no-gui --quiet --eval             "addpath('/work/validation/equivalence/matlab'); generate_authority_baseline('/work','/work/validation/reports/m7_ci/authority');"
          test -s validation/reports/m7_ci/authority/authority_baseline.mat
          cat validation/reports/m7_ci/authority/MATLAB_AUTHORITY_METADATA.txt
          set -o pipefail
          sha256sum validation/reports/m7_ci/authority/authority_baseline.mat \
            | tee validation/reports/m7_ci/authority/authority_baseline.mat.sha256

      - name: Freeze transient tolerances before Fortran comparison
        env:
          PYTHONPATH: ${{ github.workspace }}/python/src:${{ github.workspace }}
          DRMROTOR_LIB: ${{ github.workspace }}/build-formal/libdrmrotor.so
        run: |
          python validation/equivalence/freeze_transient_tolerances.py             --matlab-baseline validation/reports/m7_ci/authority/authority_baseline.mat             --source-reference-dir validation/baseline/transient             --output validation/reports/m7_ci/authority/TRANSIENT_TOLERANCES.json
          set -o pipefail
          sha256sum validation/reports/m7_ci/authority/TRANSIENT_TOLERANCES.json \
            | tee validation/reports/m7_ci/authority/TRANSIENT_TOLERANCES.json.sha256

      - name: Run formal equivalence G5-G12
        env:
          PYTHONPATH: ${{ github.workspace }}/python/src:${{ github.workspace }}
          DRMROTOR_LIB: ${{ github.workspace }}/build-formal/libdrmrotor.so
        run: |
          python validation/equivalence/run_formal_equivalence.py             --matlab-baseline validation/reports/m7_ci/authority/authority_baseline.mat             --transient-tolerances validation/reports/m7_ci/authority/TRANSIENT_TOLERANCES.json             --output validation/reports/m7_ci/FORMAL_EQUIVALENCE_M7_CI.json
          python -m json.tool validation/reports/m7_ci/FORMAL_EQUIVALENCE_M7_CI.json

      - name: Upload formal equivalence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m7-formal-octave-7.1-${{ github.sha }}
          path: |
            validation/reports/m7_ci/
            validation/baseline/transient/*_source_reference.npz
          if-no-files-found: error
          retention-days: 90

  windows-g17:
    name: Windows G17 — UCRT64 qualification
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc-fortran
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-openblas

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Record Windows qualification environment
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force validation/reports/g17_windows | Out-Null
          $env:PATH = "C:\msys64\ucrt64\bin;$env:PATH"
          $env:CMAKE_PREFIX_PATH = "C:\msys64\ucrt64"
          python --version | Tee-Object -FilePath validation/reports/g17_windows/environment.txt
          & C:\msys64\ucrt64\bin\gfortran.exe --version | Select-Object -First 1 | Tee-Object -FilePath validation/reports/g17_windows/environment.txt -Append
          & C:\msys64\ucrt64\bin\cmake.exe --version | Select-Object -First 1 | Tee-Object -FilePath validation/reports/g17_windows/environment.txt -Append
          & C:\msys64\ucrt64\bin\ninja.exe --version | Tee-Object -FilePath validation/reports/g17_windows/environment.txt -Append
          where.exe gfortran | Tee-Object -FilePath validation/reports/g17_windows/environment.txt -Append
          where.exe cmake | Tee-Object -FilePath validation/reports/g17_windows/environment.txt -Append
          where.exe ninja | Tee-Object -FilePath validation/reports/g17_windows/environment.txt -Append
          git rev-parse HEAD | Tee-Object -FilePath validation/reports/g17_windows/environment.txt -Append
          git status --porcelain=v1 | Tee-Object -FilePath validation/reports/g17_windows/environment.txt -Append

      - name: Install Python qualification dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./python[test]"

      - name: G1 authority source integrity
        shell: pwsh
        run: |
          $out = python validation/equivalence/verify_authority_sources.py
          $code = $LASTEXITCODE
          $out | Tee-Object -FilePath validation/reports/g17_windows/authority_source_integrity.json
          if ($code -ne 0) { exit $code }

      - name: Configure and build Release with MSYS2 UCRT64
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\ucrt64\bin;$env:PATH"
          $env:CMAKE_PREFIX_PATH = "C:\msys64\ucrt64"
          & C:\msys64\ucrt64\bin\cmake.exe -S fortran -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_Fortran_COMPILER=C:/msys64/ucrt64/bin/gfortran.exe -DCMAKE_PREFIX_PATH=C:/msys64/ucrt64 -DBLA_VENDOR=OpenBLAS
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & C:\msys64\ucrt64\bin\cmake.exe --build build-release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & C:\msys64\ucrt64\bin\ctest.exe --test-dir build-release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Locate and load Fortran DLL
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\ucrt64\bin;$env:PATH"
          $dll = Get-ChildItem .\build-release -Recurse -Filter "*drmrotor*.dll" | Select-Object -First 1
          if (-not $dll) { throw "drmrotor DLL not found" }
          "DRMROTOR_LIB=$($dll.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PYTHONPATH=$PWD\python\src;$PWD" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DRMROTOR_DLL_DIRS=C:\msys64\ucrt64\bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $env:DRMROTOR_LIB = $dll.FullName
          $env:PYTHONPATH = "$PWD\python\src;$PWD"
          $env:DRMROTOR_DLL_DIRS = "C:\msys64\ucrt64\bin"
          python -c "from drm_core.solver.ffi import load_library; load_library(); print('DRMROTOR_DLL_LOAD=PASS')"

      - name: Explicit Python-Fortran ABI probe
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\ucrt64\bin;$env:PATH"
          python -c "import numpy as np; from validation.equivalence.element_abi import circular; mats=circular(2,0.25,0.05,0.0,211e9,81.2e9,7810.0,0.0,0.0); assert len(mats)==4 and all(a.shape==(8,8) and np.isfinite(a).all() for a in mats); print('G17_ABI=PASS')"

      - name: Python qualification suite
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\ucrt64\bin;$env:PATH"
          $out = python -m pytest python\tests -q
          $code = $LASTEXITCODE
          $out | Tee-Object -FilePath validation/reports/g17_windows/pytest.txt
          if ($code -ne 0) { exit $code }

      - name: 22-example campaign
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\ucrt64\bin;$env:PATH"
          $out = python scripts\run_example_campaign.py --outdir validation\reports\example_campaign_windows
          $code = $LASTEXITCODE
          $out | Tee-Object -FilePath validation/reports/g17_windows/example_campaign.txt
          if ($code -ne 0) { exit $code }

      - name: Configure and build Debug with MSYS2 UCRT64
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\ucrt64\bin;$env:PATH"
          $env:CMAKE_PREFIX_PATH = "C:\msys64\ucrt64"
          & C:\msys64\ucrt64\bin\cmake.exe -S fortran -B build-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_Fortran_COMPILER=C:/msys64/ucrt64/bin/gfortran.exe -DCMAKE_PREFIX_PATH=C:/msys64/ucrt64 -DBLA_VENDOR=OpenBLAS
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & C:\msys64\ucrt64\bin\cmake.exe --build build-debug --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & C:\msys64\ucrt64\bin\ctest.exe --test-dir build-debug --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows G17 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g17-windows-evidence
          path: |
            validation/reports/g17_windows/
            validation/reports/example_campaign_windows/
          if-no-files-found: warn
          retention-days: 90
