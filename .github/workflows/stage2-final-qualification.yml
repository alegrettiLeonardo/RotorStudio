name: Stage 2 Desktop UI Final Qualification

on:
  push:
    branches:
      - feature/stage2-desktop-ui
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: stage2-final-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-final:
    name: Linux UI1-UI17/UI19/UI20 qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: ${{ github.workspace }}/python/src:${{ github.workspace }}
      DRMROTOR_LIB: ${{ github.workspace }}/build-stage2-final/libdrmrotor.so
      DRMBEARINGS_LIB: ${{ github.workspace }}/build-stage2-final/libdrmbearings.so
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install numerical and desktop dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gfortran cmake libblas-dev liblapack-dev libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 unzip

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install Core UI test and packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './python[test,studio,ui-test,package]'

      - name: UI1 verify qualified legacy Fortran core is unchanged
        run: |
          mkdir -p validation/reports/stage2_final_linux
          git diff --stat 168f53047125b71ea2b5c5a0602ce7f0aa88bd20 -- fortran/src fortran/tests | tee validation/reports/stage2_final_linux/legacy_fortran_core_diff.txt
          test -z "$(git diff --name-only 168f53047125b71ea2b5c5a0602ce7f0aa88bd20 -- fortran/src fortran/tests)"
          echo "Additive fortran/bearings and CMake integration are qualified by ROSS Bearings Native Qualification." | tee validation/reports/stage2_final_linux/additive_bearings_note.txt

      - name: Build qualified Fortran Release
        run: |
          cmake -S fortran -B build-stage2-final -DCMAKE_BUILD_TYPE=Release
          cmake --build build-stage2-final -j2
          ctest --test-dir build-stage2-final --output-on-failure | tee validation/reports/stage2_final_linux/ctest.txt

      - name: Stage 1 regression remains exactly 57 tests
        run: |
          set -o pipefail
          python -m pytest python/tests --collect-only -q | tee validation/reports/stage2_final_linux/stage1_collection.txt
          grep -Eq '57 tests collected|57 collected' validation/reports/stage2_final_linux/stage1_collection.txt
          python -m pytest python/tests -q | tee validation/reports/stage2_final_linux/stage1_pytest.txt

      - name: Complete Stage 2 UI and real-Fortran E2E suite
        run: |
          set -o pipefail
          python -m pytest python/tests_ui -q | tee validation/reports/stage2_final_linux/ui_pytest.txt
          if grep -Eqi '[1-9][0-9]* skipped' validation/reports/stage2_final_linux/ui_pytest.txt; then
            echo "Stage 2 final qualification must not skip real-Fortran UI tests" >&2
            exit 1
          fi

      - name: Capture five real application screenshots
        run: |
          python scripts/capture_stage2_ui.py --outdir validation/reports/stage2_screenshots
          for f in rotor_model.png campbell_results.png bearing_seal_editor.png frequency_response.png runup_transient.png; do
            test -s "validation/reports/stage2_screenshots/$f"
          done

      - name: Build Linux frozen application
        run: |
          ID="$(git rev-parse --short=12 HEAD)"
          python scripts/package_stage2.py --solver "$DRMROTOR_LIB" --bearing-solver "$DRMBEARINGS_LIB" --dist-dir dist/stage2 --work-dir build-stage2-pyinstaller --id "$ID"
          cat dist/stage2/PACKAGE_linux.json | tee validation/reports/stage2_final_linux/package.json

      - name: UI17/UI19 Linux clean extraction and real solver smoke
        run: |
          ZIP="$(ls dist/stage2/RotorDynamicsStudio-linux-*.zip | head -1)"
          CLEAN="$RUNNER_TEMP/rotorstudio-stage2-linux-clean"
          SMOKE="$RUNNER_TEMP/rotorstudio-stage2-linux-smoke"
          rm -rf "$CLEAN" "$SMOKE"
          mkdir -p "$CLEAN" "$SMOKE"
          unzip -q "$ZIP" -d "$CLEAN"
          cd "$CLEAN"
          unset PYTHONPATH DRMROTOR_LIB DRMROTOR_DLL_DIRS DRMBEARINGS_LIB DRMBEARINGS_DLL_DIRS
          ./RotorDynamicsStudio/RotorDynamicsStudio --qualification-smoke "$SMOKE"
          python - <<PY
          import json, pathlib
          p=pathlib.Path(r"$SMOKE/PACKAGED_SMOKE.json")
          d=json.loads(p.read_text())
          assert d["status"]=="PASS", d
          assert d["backend"]=="Fortran2018/ctypes", d
          assert d["advanced_bearing"]["status"]=="PASS", d
          assert d["advanced_bearing"]["family"]=="ball", d
          assert d["native_fluidfilm_bearing"]["status"]=="PASS", d
          assert d["native_fluidfilm_bearing"]["qualification"]=="ROSS_PARITY_PASS_B12", d
          assert d["native_fluidfilm_bearing"]["rotor_assembly"]=="PASS", d
          print(json.dumps(d,indent=2,sort_keys=True))
          PY
          cp -r "$SMOKE" "$GITHUB_WORKSPACE/validation/reports/stage2_final_linux/clean_smoke"

      - name: Record Linux final evidence
        run: |
          python - <<'PY'
          import glob, hashlib, json, os, pathlib
          zp=pathlib.Path(glob.glob('dist/stage2/RotorDynamicsStudio-linux-*.zip')[0])
          payload={
            "status":"PASS",
            "head_sha":os.environ["GITHUB_SHA"],
            "platform":"ubuntu-24.04",
            "stage1":"57/57 PASS",
            "ui_tests":"PASS",
            "real_fortran_e2e":"PASS",
            "legacy_fortran_core_diff_from_stage2_base":"ZERO",
            "advanced_bearing_runtime":"BUNDLED_AND_SMOKE_PASS",
            "native_fluidfilm_rotor_bridge":"B12_QUALIFIED_AND_SMOKE_PASS",
            "frozen_app":"PASS",
            "clean_install":"PASS",
            "mockup_screenshots":"5/5",
            "artifact":zp.name,
            "artifact_size":zp.stat().st_size,
            "artifact_sha256":hashlib.sha256(zp.read_bytes()).hexdigest(),
          }
          pathlib.Path('validation/reports/stage2_final_linux/LINUX_FINAL.json').write_text(json.dumps(payload,indent=2,sort_keys=True))
          print(json.dumps(payload,indent=2,sort_keys=True))
          PY

      - name: Upload Linux final evidence and frozen app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage2-final-linux-${{ github.sha }}
          path: |
            dist/stage2/
            validation/reports/stage2_final_linux/
            validation/reports/stage2_screenshots/
          if-no-files-found: error
          retention-days: 90

  windows-final:
    name: Windows UI18/UI19 qualification
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc-fortran
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-openblas

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Record UCRT64 runtime path
        shell: msys2 {0}
        run: |
          mkdir -p validation/reports/stage2_final_windows
          echo "UCRT64_BIN=$(cygpath -w /ucrt64/bin)" >> "$GITHUB_ENV"

      - name: Install Core UI test and packaging dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./python[test,studio,ui-test,package]"

      - name: UI1 verify qualified legacy Fortran core is unchanged
        shell: pwsh
        run: |
          $files = git diff --name-only 168f53047125b71ea2b5c5a0602ce7f0aa88bd20 -- fortran/src fortran/tests
          $files | Tee-Object -FilePath validation/reports/stage2_final_windows/legacy_fortran_core_diff.txt
          if ($files) { throw "Qualified legacy Fortran core changed: $files" }
          "Additive fortran/bearings and CMake integration are qualified by ROSS Bearings Native Qualification." | Set-Content validation/reports/stage2_final_windows/additive_bearings_note.txt

      - name: Build qualified Fortran Release with UCRT64
        shell: msys2 {0}
        run: |
          cmake -S fortran -B build-stage2-final -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_Fortran_COMPILER=/ucrt64/bin/gfortran.exe -DCMAKE_PREFIX_PATH=/ucrt64 -DBLA_VENDOR=OpenBLAS
          cmake --build build-stage2-final --parallel
          ctest --test-dir build-stage2-final --output-on-failure

      - name: Locate packaged solver dependency source
        shell: pwsh
        run: |
          $dll = Get-ChildItem .\build-stage2-final -Recurse -Filter "*drmrotor*.dll" | Select-Object -First 1
          $bearingDll = Get-ChildItem .\build-stage2-final -Recurse -Filter "*drmbearings*.dll" | Select-Object -First 1
          if (-not $dll) { throw "drmrotor DLL not found" }
          if (-not $bearingDll) { throw "drmbearings DLL not found" }
          "DRMROTOR_LIB=$($dll.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DRMBEARINGS_LIB=$($bearingDll.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DRMROTOR_DLL_DIRS=$env:UCRT64_BIN" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DRMBEARINGS_DLL_DIRS=$env:UCRT64_BIN" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PYTHONPATH=$PWD\python\src;$PWD" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Stage 1 regression remains exactly 57 tests
        shell: pwsh
        run: |
          $env:PATH = "$env:UCRT64_BIN;$env:PATH"
          $collection = python -m pytest python\tests --collect-only -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $collection | Tee-Object -FilePath validation/reports/stage2_final_windows/stage1_collection.txt
          if (-not ($collection -match '57 tests collected|57 collected')) { throw "Stage 1 collection is not 57" }
          $out = python -m pytest python\tests -q
          $code = $LASTEXITCODE
          $out | Tee-Object -FilePath validation/reports/stage2_final_windows/stage1_pytest.txt
          if ($code -ne 0) { exit $code }

      - name: Complete Windows Stage 2 UI and real-Fortran E2E suite
        shell: pwsh
        run: |
          $env:PATH = "$env:UCRT64_BIN;$env:PATH"
          $out = python -m pytest python\tests_ui -q
          $code = $LASTEXITCODE
          $out | Tee-Object -FilePath validation/reports/stage2_final_windows/ui_pytest.txt
          if ($code -ne 0) { exit $code }
          if ($out -match '[1-9][0-9]* skipped') { throw "Stage 2 final qualification must not skip real-Fortran UI tests" }

      - name: Build Windows frozen application
        shell: pwsh
        run: |
          $env:PATH = "$env:UCRT64_BIN;$env:PATH"
          $id = $env:GITHUB_SHA.Substring(0,12)
          python scripts\package_stage2.py --solver "$env:DRMROTOR_LIB" --bearing-solver "$env:DRMBEARINGS_LIB" --dist-dir dist\stage2 --work-dir build-stage2-pyinstaller --id "$id"
          Get-Content dist\stage2\PACKAGE_win32.json | Tee-Object -FilePath validation/reports/stage2_final_windows/package.json

      - name: UI18/UI19 Windows clean extraction and real solver smoke
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist\stage2\RotorDynamicsStudio-win32-*.zip | Select-Object -First 1
          if (-not $zip) { throw "Windows package ZIP not found" }
          $clean = Join-Path $env:RUNNER_TEMP "rotorstudio-stage2-windows-clean"
          $smoke = Join-Path $env:RUNNER_TEMP "rotorstudio-stage2-windows-smoke"
          Remove-Item $clean,$smoke -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $clean,$smoke | Out-Null
          Expand-Archive -Path $zip.FullName -DestinationPath $clean
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          Remove-Item Env:DRMROTOR_LIB -ErrorAction SilentlyContinue
          Remove-Item Env:DRMROTOR_DLL_DIRS -ErrorAction SilentlyContinue
          Remove-Item Env:DRMBEARINGS_LIB -ErrorAction SilentlyContinue
          Remove-Item Env:DRMBEARINGS_DLL_DIRS -ErrorAction SilentlyContinue
          $exe = Join-Path $clean "RotorDynamicsStudio\RotorDynamicsStudio.exe"
          $proc = Start-Process -FilePath $exe -ArgumentList @("--qualification-smoke", $smoke) -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "packaged app smoke exit code $($proc.ExitCode)" }
          $payload = Get-Content (Join-Path $smoke "PACKAGED_SMOKE.json") | ConvertFrom-Json
          if ($payload.status -ne "PASS") { throw "packaged smoke failed" }
          if ($payload.advanced_bearing.status -ne "PASS") { throw "packaged advanced-bearing smoke failed" }
          if ($payload.advanced_bearing.family -ne "ball") { throw "unexpected packaged advanced-bearing family" }
          if ($payload.native_fluidfilm_bearing.status -ne "PASS") { throw "packaged native fluid-film smoke failed" }
          if ($payload.native_fluidfilm_bearing.qualification -ne "ROSS_PARITY_PASS_B12") { throw "native fluid-film qualification missing" }
          if ($payload.native_fluidfilm_bearing.rotor_assembly -ne "PASS") { throw "native fluid-film rotor assembly failed" }
          Copy-Item $smoke validation\reports\stage2_final_windows\clean_smoke -Recurse

      - name: Record Windows final evidence
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist\stage2\RotorDynamicsStudio-win32-*.zip | Select-Object -First 1
          $hash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
          $payload = [ordered]@{
            status = "PASS"
            head_sha = $env:GITHUB_SHA
            platform = "windows-2025 / UCRT64"
            stage1 = "57/57 PASS"
            ui_tests = "PASS"
            real_fortran_e2e = "PASS"
            legacy_fortran_core_diff_from_stage2_base = "ZERO"
            advanced_bearing_runtime = "BUNDLED_AND_SMOKE_PASS"
            frozen_app = "PASS"
            clean_install = "PASS"
            artifact = $zip.Name
            artifact_size = $zip.Length
            artifact_sha256 = $hash
          }
          $payload | ConvertTo-Json | Set-Content validation\reports\stage2_final_windows\WINDOWS_FINAL.json
          $payload | ConvertTo-Json

      - name: Upload Windows final evidence and frozen app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage2-final-windows-${{ github.sha }}
          path: |
            dist/stage2/
            validation/reports/stage2_final_windows/
          if-no-files-found: error
          retention-days: 90

  final-gate:
    name: UI1-UI20 aggregate final gate
    needs: [linux-final, windows-final]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require both platform qualifications
        env:
          LINUX_RESULT: ${{ needs.linux-final.result }}
          WINDOWS_RESULT: ${{ needs.windows-final.result }}
        run: |
          test "$LINUX_RESULT" = "success"
          test "$WINDOWS_RESULT" = "success"

      - uses: actions/download-artifact@v4
        with:
          pattern: stage2-final-*-${{ github.sha }}
          path: validation/reports/stage2_downloaded
          merge-multiple: true

      - name: Write UI1-UI20 matrix
        run: |
          mkdir -p validation/reports
          python - <<'PY'
          import json, os, pathlib
          gates = {f"UI{i}":"PASS" for i in range(1,21)}
          payload={
            "schema_version":1,
            "status":"PASS",
            "stage2_status":"COMPLETE",
            "stage2_base_head":"168f53047125b71ea2b5c5a0602ce7f0aa88bd20",
            "head_sha":os.environ["GITHUB_SHA"],
            "gates":gates,
            "required_evidence":{
              "stage1_regression":"57/57 on Linux and Windows",
              "real_fortran_e2e":"PASS on Linux and Windows",
              "linux_frozen":"PASS",
              "windows_frozen":"PASS",
              "clean_install":"PASS on Linux and Windows",
              "mockup_screenshots":"5 real application screenshots generated on Linux",
              "legacy_fortran_core_diff":"ZERO vs STAGE2_BASE_HEAD",
              "advanced_bearing_runtime":"bundled libdrmbearings + clean frozen smoke PASS",
              "native_fluidfilm_rotor_bridge":"B12 qualified + clean frozen assembly smoke PASS",
            },
          }
          pathlib.Path("validation/reports/STAGE2_FINAL_QUALIFICATION.json").write_text(json.dumps(payload,indent=2,sort_keys=True))
          print(json.dumps(payload,indent=2,sort_keys=True))
          PY

      - name: Upload aggregate Stage 2 gate
        uses: actions/upload-artifact@v4
        with:
          name: stage2-final-gate-${{ github.sha }}
          path: validation/reports/STAGE2_FINAL_QUALIFICATION.json
          if-no-files-found: error
          retention-days: 90
