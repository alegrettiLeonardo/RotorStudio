name: B1 one-time reviewed authority publication

on:
  push:
    branches: [feature/ross-analysis-b1-6dof-element-matrices]
    paths:
      - validation/b1/FREEZE_REVIEW.json
      - validation/b1/freeze_reviewed_authority.py
      - .github/workflows/b1-6dof-initial-freeze.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b1-one-time-authority-publication
  cancel-in-progress: false

jobs:
  first-freeze:
    if: github.ref == 'refs/heads/feature/ross-analysis-b1-6dof-element-matrices'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Set LF checkout policy
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Guard first-publication-only behavior
        id: guard
        run: |
          if test -e validation/ross_parity/6dof_elements; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            echo 'Authority already exists. This workflow will not regenerate, edit, commit or overwrite it.'
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.exists == 'false'
        with:
          python-version: '3.12'
      - name: Install validation-only dependencies
        if: steps.guard.outputs.exists == 'false'
        run: |
          python -m pip install numpy==2.5.3 pytest==9.1.1
          python -m pip check
      - name: Retrieve reviewed bytes, verify, compare, test and freeze once
        if: steps.guard.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python validation/b1/freeze_reviewed_authority.py --download-root b1-freeze-evidence/reviewed
      - name: Publish only additive first authority (never force push)
        if: steps.guard.outputs.exists == 'false'
        env:
          BRANCH: feature/ross-analysis-b1-6dof-element-matrices
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git diff --exit-code
          git add -- validation/ross_parity/6dof_elements
          python - <<'PY'
          import subprocess
          rows=subprocess.check_output(['git','diff','--cached','--name-status'],text=True).splitlines()
          assert rows and all(row.startswith('A\tvalidation/ross_parity/6dof_elements/') for row in rows),rows
          print('B1_ADDITIVE_FREEZE_FILES',len(rows))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'B1 authority: freeze the reviewed 113 ROSS matrices and pre-native tolerance policy'
          test "$(git rev-parse HEAD^)" = "$GITHUB_SHA"
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "B1_FROZEN_COMMIT=$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@v4
        if: always() && steps.guard.outputs.exists == 'false'
        with:
          name: b1-first-freeze-${{ github.sha }}
          path: |
            b1-freeze-evidence/
            validation/ross_parity/6dof_elements/
          if-no-files-found: error
          retention-days: 90
