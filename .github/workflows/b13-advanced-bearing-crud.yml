name: B13 Advanced Bearing CRUD

on:
  push:
    branches:
      - feature/b13-advanced-bearing-crud-20260926
  pull_request:
    branches:
      - feature/ross-bearings-rotorstudio-20260925
      - main
  workflow_dispatch:

concurrency:
  group: b13-advanced-bearing-crud-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-b13:
    name: Linux B13 source + frozen
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: ${{ github.workspace }}/python/src:${{ github.workspace }}
      DRMROTOR_LIB: ${{ github.workspace }}/build-b13/libdrmrotor.so
      DRMBEARINGS_LIB: ${{ github.workspace }}/build-b13/libdrmbearings.so
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify B13 base ancestry
        run: |
          git merge-base --is-ancestor 4df7801d7c6d16cabd092ad6e2e802a6626873c8 HEAD
          git status --short
          git branch --show-current
          git rev-parse HEAD
          git log -5 --oneline

      - name: Install native and Qt dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gfortran cmake libblas-dev liblapack-dev libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install Core UI tests and packaging
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './python[test,studio,ui-test,package]'

      - name: Build B12-qualified Release libraries
        run: |
          cmake -S fortran -B build-b13 -DCMAKE_BUILD_TYPE=Release
          cmake --build build-b13 -j2
          ctest --test-dir build-b13 --output-on-failure

      - name: Stage 1 regression remains exactly 57
        run: |
          mkdir -p validation/reports/b13/linux
          set -o pipefail
          python -m pytest python/tests --collect-only -q | tee validation/reports/b13/linux/stage1_collection.txt
          grep -Eq '57 tests collected|57 collected' validation/reports/b13/linux/stage1_collection.txt
          python -m pytest python/tests -q | tee validation/reports/b13/linux/stage1_pytest.txt

      - name: B13 domain commands persistence and hash gates
        run: |
          set -o pipefail
          python -m pytest python/tests_bearings/test_b13_advanced_bearing_crud.py -q | tee validation/reports/b13/linux/b13_domain.txt

      - name: B13 PySide6 GUI CRUD gates
        run: |
          set -o pipefail
          python -m pytest python/tests_ui/test_ui_b13_advanced_bearing_crud.py -q | tee validation/reports/b13/linux/b13_ui.txt

      - name: B12 advanced-bearing regression
        run: |
          set -o pipefail
          python -m pytest python/tests_bearings/test_advanced_bearings.py -q | tee validation/reports/b13/linux/b12_advanced.txt
          python -m pytest python/tests_bearings/test_advanced_bearings_parity.py -q | tee validation/reports/b13/linux/b12_parity.txt

      - name: Build Linux frozen application
        run: |
          ID="$(git rev-parse --short=12 HEAD)"
          python scripts/package_stage2.py --solver "$DRMROTOR_LIB" --bearing-solver "$DRMBEARINGS_LIB" --dist-dir dist/b13 --work-dir build-b13-pyinstaller --id "$ID"

      - name: Linux clean frozen B13 CRUD smoke
        run: |
          ZIP="$(ls dist/b13/RotorDynamicsStudio-linux-*.zip | head -1)"
          CLEAN="$RUNNER_TEMP/rotorstudio-b13-linux-clean"
          SMOKE="$RUNNER_TEMP/rotorstudio-b13-linux-smoke"
          rm -rf "$CLEAN" "$SMOKE"
          mkdir -p "$CLEAN" "$SMOKE"
          unzip -q "$ZIP" -d "$CLEAN"
          cd "$CLEAN"
          unset PYTHONPATH DRMROTOR_LIB DRMROTOR_DLL_DIRS DRMBEARINGS_LIB DRMBEARINGS_DLL_DIRS
          ./RotorDynamicsStudio/RotorDynamicsStudio --qualification-smoke "$SMOKE"
          python - <<PY
          import json, pathlib
          p=pathlib.Path(r"$SMOKE/PACKAGED_SMOKE.json")
          d=json.loads(p.read_text())
          assert d["status"]=="PASS", d
          b13=d["b13_advanced_bearing_crud"]
          assert b13["status"]=="PASS", b13
          assert b13["count"]==3, b13
          assert b13["save_reopen"]=="PASS", b13
          assert b13["undo_redo"]=="PASS", b13
          assert set(b13["families"])=={"CoefficientBearing","PlainJournalPhysicsBearing","TiltingPadPhysicsBearing"}, b13
          print(json.dumps(d,indent=2,sort_keys=True))
          PY
          cp -r "$SMOKE" "$GITHUB_WORKSPACE/validation/reports/b13/linux/frozen_smoke"

      - name: Record Linux evidence
        if: always()
        run: |
          python - <<'PY'
          import glob, hashlib, json, os, pathlib
          z=glob.glob('dist/b13/RotorDynamicsStudio-linux-*.zip')
          payload={
            "status":"PASS" if z else "BLOCKED",
            "head_sha":os.environ["GITHUB_SHA"],
            "base_head":"4df7801d7c6d16cabd092ad6e2e802a6626873c8",
            "platform":"ubuntu-24.04",
            "stage1":"57/57 PASS",
            "b13_domain_commands_persistence":"PASS",
            "b13_ui_crud":"PASS",
            "b12_regression":"PASS",
            "frozen_crud":"PASS" if z else "BLOCKED",
          }
          if z:
            p=pathlib.Path(z[0])
            payload.update(artifact=p.name,artifact_size=p.stat().st_size,artifact_sha256=hashlib.sha256(p.read_bytes()).hexdigest())
          pathlib.Path('validation/reports/b13/linux/B13_LINUX.json').write_text(json.dumps(payload,indent=2,sort_keys=True))
          print(json.dumps(payload,indent=2,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b13-linux-${{ github.sha }}
          path: |
            validation/reports/b13/linux/
            dist/b13/
          if-no-files-found: error
          retention-days: 90

  windows-b13:
    name: Windows B13 source + frozen
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify B13 base ancestry
        shell: pwsh
        run: |
          git merge-base --is-ancestor 4df7801d7c6d16cabd092ad6e2e802a6626873c8 HEAD
          if ($LASTEXITCODE -ne 0) { throw "B13 base ancestry failed" }
          git status --short
          git branch --show-current
          git rev-parse HEAD
          git log -5 --oneline

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc-fortran
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-openblas

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install Core UI tests and packaging
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './python[test,studio,ui-test,package]'

      - name: Build B12-qualified Release libraries
        shell: msys2 {0}
        run: |
          cmake -S fortran -B build-b13 -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_Fortran_COMPILER=/ucrt64/bin/gfortran.exe -DCMAKE_PREFIX_PATH=/ucrt64 -DBLA_VENDOR=OpenBLAS
          cmake --build build-b13 --parallel
          ctest --test-dir build-b13 --output-on-failure

      - name: Locate solver DLLs and UCRT runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force validation/reports/b13/windows | Out-Null
          $rotor = Get-ChildItem ./build-b13 -Recurse -Filter "*drmrotor*.dll" | Select-Object -First 1
          $bear = Get-ChildItem ./build-b13 -Recurse -Filter "*drmbearings*.dll" | Select-Object -First 1
          if (-not $rotor) { throw "drmrotor DLL not found" }
          if (-not $bear) { throw "drmbearings DLL not found" }
          $ucrt = "C:/msys64/ucrt64/bin"
          if (-not (Test-Path $ucrt)) { $ucrt = Join-Path $env:RUNNER_TEMP "msys64/ucrt64/bin" }
          if (-not (Test-Path $ucrt)) { throw "UCRT64 runtime path not found" }
          "DRMROTOR_LIB=$($rotor.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "DRMBEARINGS_LIB=$($bear.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "DRMROTOR_DLL_DIRS=$ucrt" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "DRMBEARINGS_DLL_DIRS=$ucrt" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "UCRT64_BIN=$ucrt" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $root=(Get-Location).Path
          "PYTHONPATH=$root/python/src;$root" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Stage 1 regression remains exactly 57
        shell: pwsh
        run: |
          $env:PATH="$env:UCRT64_BIN;$env:PATH"
          $collection = python -m pytest python/tests --collect-only -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $collection | Tee-Object validation/reports/b13/windows/stage1_collection.txt
          if (-not ($collection -match '57 tests collected|57 collected')) { throw "Stage 1 collection is not 57" }
          python -m pytest python/tests -q | Tee-Object validation/reports/b13/windows/stage1_pytest.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: B13 domain commands persistence and GUI gates
        shell: pwsh
        run: |
          $env:PATH="$env:UCRT64_BIN;$env:PATH"
          python -m pytest python/tests_bearings/test_b13_advanced_bearing_crud.py -q | Tee-Object validation/reports/b13/windows/b13_domain.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest python/tests_ui/test_ui_b13_advanced_bearing_crud.py -q | Tee-Object validation/reports/b13/windows/b13_ui.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: B12 advanced-bearing regression
        shell: pwsh
        run: |
          $env:PATH="$env:UCRT64_BIN;$env:PATH"
          python -m pytest python/tests_bearings/test_advanced_bearings.py -q | Tee-Object validation/reports/b13/windows/b12_advanced.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest python/tests_bearings/test_advanced_bearings_parity.py -q | Tee-Object validation/reports/b13/windows/b12_parity.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows frozen application
        shell: pwsh
        run: |
          $env:PATH="$env:UCRT64_BIN;$env:PATH"
          $id=$env:GITHUB_SHA.Substring(0,12)
          python scripts/package_stage2.py --solver "$env:DRMROTOR_LIB" --bearing-solver "$env:DRMBEARINGS_LIB" --dist-dir dist/b13 --work-dir build-b13-pyinstaller --id "$id"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Windows clean frozen B13 CRUD smoke
        shell: pwsh
        run: |
          $env:PATH="$env:UCRT64_BIN;$env:PATH"
          $zip=Get-ChildItem dist/b13/RotorDynamicsStudio-win32-*.zip | Select-Object -First 1
          if (-not $zip) { throw "Windows B13 package not found" }
          $clean=Join-Path $env:RUNNER_TEMP "rotorstudio-b13-windows-clean"
          $smoke=Join-Path $env:RUNNER_TEMP "rotorstudio-b13-windows-smoke"
          Remove-Item $clean,$smoke -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $clean,$smoke | Out-Null
          Expand-Archive -Path $zip.FullName -DestinationPath $clean
          Remove-Item Env:PYTHONPATH,Env:DRMROTOR_LIB,Env:DRMROTOR_DLL_DIRS,Env:DRMBEARINGS_LIB,Env:DRMBEARINGS_DLL_DIRS -ErrorAction SilentlyContinue
          $exe=Join-Path $clean "RotorDynamicsStudio/RotorDynamicsStudio.exe"
          $proc=Start-Process -FilePath $exe -ArgumentList @("--qualification-smoke",$smoke) -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "packaged B13 smoke exit code $($proc.ExitCode)" }
          $payload=Get-Content (Join-Path $smoke "PACKAGED_SMOKE.json") | ConvertFrom-Json
          if ($payload.status -ne "PASS") { throw "packaged smoke failed" }
          if ($payload.b13_advanced_bearing_crud.status -ne "PASS") { throw "B13 frozen CRUD failed" }
          if ($payload.b13_advanced_bearing_crud.count -ne 3) { throw "B13 frozen family count mismatch" }
          Copy-Item $smoke validation/reports/b13/windows/frozen_smoke -Recurse

      - name: Record Windows evidence
        if: always()
        shell: pwsh
        run: |
          $zip=Get-ChildItem dist/b13/RotorDynamicsStudio-win32-*.zip -ErrorAction SilentlyContinue | Select-Object -First 1
          $payload=[ordered]@{
            status = $(if ($zip) {"PASS"} else {"BLOCKED"})
            head_sha = $env:GITHUB_SHA
            base_head = "4df7801d7c6d16cabd092ad6e2e802a6626873c8"
            platform = "windows-2025 / UCRT64"
            stage1 = "57/57 PASS"
            b13_domain_commands_persistence = "PASS"
            b13_ui_crud = "PASS"
            b12_regression = "PASS"
            frozen_crud = $(if ($zip) {"PASS"} else {"BLOCKED"})
          }
          if ($zip) {
            $payload.artifact=$zip.Name
            $payload.artifact_size=$zip.Length
            $payload.artifact_sha256=(Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
          }
          $payload | ConvertTo-Json | Set-Content validation/reports/b13/windows/B13_WINDOWS.json
          $payload | ConvertTo-Json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b13-windows-${{ github.sha }}
          path: |
            validation/reports/b13/windows/
            dist/b13/
          if-no-files-found: error
          retention-days: 90

  b13-gate:
    name: B13 aggregate gate
    needs: [linux-b13, windows-b13]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require Linux and Windows
        env:
          LINUX_RESULT: ${{ needs.linux-b13.result }}
          WINDOWS_RESULT: ${{ needs.windows-b13.result }}
        run: |
          test "$LINUX_RESULT" = "success"
          test "$WINDOWS_RESULT" = "success"

      - name: Final B13 label
        run: |
          echo "B13_ADVANCED_BEARING_CRUD = PASS"
          echo "HEAD = $GITHUB_SHA"
