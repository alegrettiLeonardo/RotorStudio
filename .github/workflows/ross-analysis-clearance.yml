name: ROSS Analysis A8 Clearance Qualification

on:
  push:
    branches: [feature/ross-analysis-a8-clearance]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-clearance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    env:
      QT_QPA_PLATFORM: offscreen
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      A5_ORDER_EVIDENCE: a8-evidence/a5-before-after
      A8_QUALIFICATION_EVIDENCE: a8-evidence/independent
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python dependencies
        run: |
          python -m pip install -e "./python[test,studio,ui-test]"
          python -c "from pathlib import Path; Path('a8-evidence').mkdir(exist_ok=True)"
      - name: Record exact tested HEAD
        shell: bash
        run: git rev-parse HEAD > a8-evidence/tested-head.txt
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y gfortran cmake libblas-dev liblapack-dev libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc-fortran mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-openblas
      - name: Linux Release
        if: runner.os == 'Linux'
        run: |
          cmake -S fortran -B build-a8 -DCMAKE_BUILD_TYPE=Release
          cmake --build build-a8 -j2
          ctest --test-dir build-a8 --output-on-failure --output-junit "$PWD/a8-evidence/ctest.xml"
          echo "DRMROTOR_LIB=$PWD/build-a8/libdrmrotor.so" >> "$GITHUB_ENV"
          echo "DRMBEARINGS_LIB=$PWD/build-a8/libdrmbearings.so" >> "$GITHUB_ENV"
          echo "PYTHONPATH=$PWD/python/src:$PWD" >> "$GITHUB_ENV"
      - name: Windows Release
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake -S fortran -B build-a8 -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_Fortran_COMPILER=/ucrt64/bin/gfortran.exe -DCMAKE_PREFIX_PATH=/ucrt64 -DBLA_VENDOR=OpenBLAS
          cmake --build build-a8 --parallel
          ctest --test-dir build-a8 --output-on-failure --output-junit "$(cygpath -m "$PWD/a8-evidence/ctest.xml")"
          echo "DRMROTOR_DLL_DIRS=$(cygpath -w /ucrt64/bin)" >> "$GITHUB_ENV"
          echo "DRMBEARINGS_DLL_DIRS=$(cygpath -w /ucrt64/bin)" >> "$GITHUB_ENV"
      - name: Windows library paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dll = Get-ChildItem build-a8 -Recurse -Filter '*drmrotor*.dll' | Select-Object -First 1
          $bearing = Get-ChildItem build-a8 -Recurse -Filter '*drmbearings*.dll' | Select-Object -First 1
          "DRMROTOR_LIB=$($dll.FullName)" >> $env:GITHUB_ENV
          "DRMBEARINGS_LIB=$($bearing.FullName)" >> $env:GITHUB_ENV
          "PYTHONPATH=$PWD\python\src;$PWD" >> $env:GITHUB_ENV
      - name: Immutable A0-A8 authorities present
        shell: bash
        run: |
          test -f validation/ross_parity/clearance/authority.json
          grep -q 6320eab9f890f1b3cc1710d508b446fe063ca68d validation/ross_parity/clearance/authority.json
          test -f validation/ross_parity/api617_unbalance/authority.json
          test -f validation/ross_parity/level1/authority.json
          test -f validation/ross_parity/ucs/authority.json
          test -f validation/ross_parity/time_response/authority.json
          test -f validation/ross_parity/forced/authority.json
          test -f validation/ross_parity/frf/authority.json
          test -f validation/ross_parity/static/authority.json
      - name: Preserve A1-A7 and legacy native paths
        run: python scripts/verify_a1_legacy_preservation.py
      - name: Inherited A5 historical and corrective UCS gate
        run: python -m pytest python/tests_ucs -q --junitxml=a8-evidence/a5-ucs.xml
      - name: Inherited A6 Level 1 gate
        run: python -m pytest python/tests_level1 -q --junitxml=a8-evidence/a6-level1.xml
      - name: Inherited A7 API 617 unbalance gate
        run: python -m pytest python/tests_api617_unbalance -q --junitxml=a8-evidence/a7-unbalance.xml
      - name: A8 clearance frozen parity independent boundaries and marshalling
        run: python -m pytest python/tests_clearance -q --junitxml=a8-evidence/a8-clearance.xml
      - name: A0-A4 and Stage 1 regression
        run: python -m pytest python/tests_time python/tests_forced python/tests_frf python/tests_static python/tests -q --junitxml=a8-evidence/broad.xml
      - name: Bearing foundation regression
        run: python -m pytest python/tests_bearings -q --junitxml=a8-evidence/bearings.xml
      - name: Exact frozen ROSS source for response-first audit
        shell: bash
        run: |
          set -euo pipefail
          git init _ross_a8_intermediate
          git -C _ross_a8_intermediate config core.autocrlf false
          git -C _ross_a8_intermediate config core.eol lf
          git -C _ross_a8_intermediate remote add origin https://github.com/petrobras/ross.git
          git -C _ross_a8_intermediate fetch --depth=1 origin 6320eab9f890f1b3cc1710d508b446fe063ca68d
          git -C _ross_a8_intermediate checkout --detach 6320eab9f890f1b3cc1710d508b446fe063ca68d
          git -C _ross_a8_intermediate rev-parse HEAD > a8-evidence/ross-head.txt
          python - <<'PY'
          import hashlib,json,pathlib,subprocess
          root=pathlib.Path('_ross_a8_intermediate')
          manifest=json.loads(pathlib.Path('validation/ross_parity/clearance/authority.json').read_text())
          rows={}
          for relative,expected in manifest['source_sha256'].items():
              blob=subprocess.check_output(['git','cat-file','blob','HEAD:'+relative],cwd=root)
              working=(root/relative).read_bytes()
              rows[relative]={
                  'expected_sha256':expected,
                  'blob_sha256':hashlib.sha256(blob).hexdigest(),
                  'working_sha256':hashlib.sha256(working).hexdigest(),
                  'blob_crlf':blob.count(b'\r\n'),
                  'working_crlf':working.count(b'\r\n'),
                  'bytes_equal':working==blob,
              }
          text=json.dumps(rows,indent=2,sort_keys=True)
          pathlib.Path('a8-evidence/ross-source-bytes.json').write_text(text,encoding='utf-8')
          print(text)
          assert all(r['bytes_equal'] and r['expected_sha256']==r['blob_sha256']==r['working_sha256'] for r in rows.values()),'Frozen ROSS working bytes differ from authority/blob'
          PY
      - name: Isolated dependency-consistent ROSS and intermediate response audit
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv-a8-authority
          if [ "$RUNNER_OS" = "Windows" ]; then
            P=.venv-a8-authority/Scripts/python.exe
          else
            P=.venv-a8-authority/bin/python
          fi
          "$P" -m pip install -e './python[test]' -e ./_ross_a8_intermediate
          "$P" -m pip check
          "$P" -m pip freeze > a8-evidence/authority-environment.txt
          "$P" validation/a8/qualify_clearance_intermediates.py --ross-root _ross_a8_intermediate --out a8-evidence/intermediates.json
          git diff --exit-code HEAD -- validation/ross_parity
      - name: Require every collected native inheritance and A8 test to execute
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for name in ['a5-ucs','a6-level1','a7-unbalance','a8-clearance','broad','bearings']:
              path=Path('a8-evidence')/(name+'.xml')
              root=ET.parse(path).getroot()
              cases=root.findall('.//testcase')
              bad=[c.attrib.get('name') for c in cases if any(c.find(t) is not None for t in ['failure','error','skipped'])]
              assert cases and not bad,(name,bad)
              print(name,len(cases),'PASS; failures/errors/skips=0')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a8-native-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: a8-evidence/
          if-no-files-found: error
          retention-days: 90
