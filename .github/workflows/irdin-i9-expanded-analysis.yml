name: iRdin I9 Expanded Modal Response Qualification
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


on:
  push:
    branches: [feature/irdin-api541-dynamics]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE/python/src:$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v="$env:GITHUB_WORKSPACE\python\src;$env:GITHUB_WORKSPACE"
          "PYTHONPATH=$v" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Python dependencies
        run: |
          python -m pip install -e "./python[test]"
          python -m pip check
      - name: Linux build
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gfortran libblas-dev liblapack-dev
          cmake -S fortran -B build-i9 -DCMAKE_BUILD_TYPE=Release
          cmake --build build-i9 --parallel 2
          ctest --test-dir build-i9 --output-on-failure
          echo "DRMROTOR_LIB=${{ github.workspace }}/build-i9/libdrmrotor.so" >> "$GITHUB_ENV"
          echo "DRMBEARINGS_LIB=${{ github.workspace }}/build-i9/libdrmbearings.so" >> "$GITHUB_ENV"
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc-fortran mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-openblas
      - name: Windows build
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cmake -S fortran -B build-i9 -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_Fortran_COMPILER=/ucrt64/bin/gfortran.exe -DCMAKE_PREFIX_PATH=/ucrt64 -DBLA_VENDOR=OpenBLAS
          cmake --build build-i9 --parallel 2
          ctest --test-dir build-i9 --output-on-failure
          echo "DRMROTOR_LIB=$(cygpath -w "$PWD/build-i9/libdrmrotor.dll")" >> "$GITHUB_ENV"
          echo "DRMBEARINGS_LIB=$(cygpath -w "$PWD/build-i9/libdrmbearings.dll")" >> "$GITHUB_ENV"
          echo "DRMROTOR_DLL_DIRS=$(cygpath -w /ucrt64/bin)" >> "$GITHUB_ENV"
          echo "DRMBEARINGS_DLL_DIRS=$(cygpath -w /ucrt64/bin)" >> "$GITHUB_ENV"
          cygpath -w /ucrt64/bin >> "$GITHUB_PATH"
      - name: Immutable source authority
        run: python validation/irdin/i0_authority.py --verify
      - name: I9 native and legacy-convention tests
        run: >-
          python -m pytest
          python/tests_irdin/test_i8_support_global.py
          python/tests_irdin/test_i9_support_analysis.py
          python/tests/test_freq_rsp_source_oracle.py
          -q
          --junitxml=irdin-i9-${{ runner.os }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: irdin-i9-${{ runner.os }}-${{ github.sha }}
          path: irdin-i9-${{ runner.os }}.xml
          if-no-files-found: error
          retention-days: 30
