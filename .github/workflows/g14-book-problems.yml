name: G14 Book Problem Regression

on:
  push:
    branches:
      - feature/stage1-final-closure
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: g14-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  g14:
    name: 83 problems + Octave 7.1 + Fortran regression
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install numerical toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gfortran cmake libblas-dev liblapack-dev

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install Python qualification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './python[test]'

      - name: Materialize exact DRM problem authority
        run: |
          python validation/book_problems/materialize_archive.py \
            --target reference/drm_problem_scripts \
            --write-zip validation/reports/DRM_problem_scripts.authority.zip

      - name: Generate 83-case semantic inventory
        run: |
          set -o pipefail
          python validation/book_problems/inventory.py \
            --problem-dir reference/drm_problem_scripts \
            --output validation/reports/problem_inventory.json \
            --csv-output validation/reports/problem_inventory.csv \
            --md-output validation/reports/BOOK_PROBLEM_INVENTORY.md \
            | tee validation/reports/G14_INVENTORY_CONSOLE.txt

      - name: Verify frozen V2 numerical authority
        run: |
          set -o pipefail
          python validation/equivalence/verify_authority_sources.py \
            | tee validation/reports/G14_AUTHORITY_SOURCE_INTEGRITY.json

      - name: Build and test Fortran Release
        run: |
          cmake -S fortran -B build-g14 -DCMAKE_BUILD_TYPE=Release
          cmake --build build-g14 -j2
          ctest --test-dir build-g14 --output-on-failure

      - name: Pull pinned GNU Octave 7.1.0
        run: |
          docker pull gnuoctave/octave:7.1.0
          docker image inspect gnuoctave/octave:7.1.0 \
            --format '{{index .RepoDigests 0}}' \
            > validation/reports/G14_OCTAVE_7_1_DIGEST.txt

      - name: Octave probe run 1 with product workspaces
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            gnuoctave/octave:7.1.0 \
            octave --no-gui --quiet --eval \
            "addpath('/work/validation/book_problems/octave'); run_problem_suite('/work','/work/validation/reports/book_problems/octave_run1',1);"

      - name: Octave probe run 2 independent repeat
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            gnuoctave/octave:7.1.0 \
            octave --no-gui --quiet --eval \
            "addpath('/work/validation/book_problems/octave'); run_problem_suite('/work','/work/validation/reports/book_problems/octave_run2',0);"

      - name: Execute G14 regression
        env:
          PYTHONPATH: ${{ github.workspace }}/python/src:${{ github.workspace }}
          DRMROTOR_LIB: ${{ github.workspace }}/build-g14/libdrmrotor.so
        run: |
          set -o pipefail
          python validation/book_problems/run_regression.py \
            --problem-dir reference/drm_problem_scripts \
            --run1 validation/reports/book_problems/octave_run1 \
            --run2 validation/reports/book_problems/octave_run2 \
            --report-dir validation/reports \
            | tee validation/reports/G14_CONSOLE.txt

      - name: Record build environment
        if: always()
        run: |
          {
            echo "github_sha=$GITHUB_SHA"
            python --version
            gfortran --version | head -1
            cmake --version | head -1
            echo "blas_lapack_packages:"
            dpkg-query -W -f='${Package} ${Version}\n' libblas-dev liblapack-dev || true
          } > validation/reports/G14_BUILD_ENVIRONMENT.txt

      - name: Upload G14 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g14-book-problems-${{ github.sha }}
          path: |
            validation/reports/problem_inventory.json
            validation/reports/problem_inventory.csv
            validation/reports/BOOK_PROBLEM_INVENTORY.md
            validation/reports/G14_BOOK_PROBLEM_REGRESSION.json
            validation/reports/G14_BOOK_PROBLEM_REGRESSION.csv
            validation/reports/G14_BOOK_PROBLEM_REGRESSION.md
            validation/reports/G14_ENVIRONMENT.json
            validation/reports/G14_BUILD_ENVIRONMENT.txt
            validation/reports/COMMANDS_EXECUTED_G14.md
            validation/reports/G14_AUTHORITY_SOURCE_INTEGRITY.json
            validation/reports/G14_OCTAVE_7_1_DIGEST.txt
            validation/reports/G14_*CONSOLE.txt
            validation/reports/DRM_problem_scripts.authority.zip
            validation/reports/book_problems/
          if-no-files-found: warn
          retention-days: 90
