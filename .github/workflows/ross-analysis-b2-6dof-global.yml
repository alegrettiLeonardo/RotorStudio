name: ROSS Analysis B2 6DOF Global Modal Campbell Qualification

on:
  push:
    branches: [feature/ross-analysis-b2-6dof-global-modal-campbell]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONHASHSEED: '0'
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: '1'
  QT_QPA_PLATFORM: offscreen
  MPLBACKEND: Agg

jobs:
  native-build:
    name: B2 native + frozen parity / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 70
    steps:
      - name: Preserve raw Git bytes
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set Linux qualification Python path
        if: runner.os == 'Linux'
        shell: bash
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE/python/src:$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Set Windows qualification Python path
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "PYTHONPATH=$env:GITHUB_WORKSPACE\python\src;$env:GITHUB_WORKSPACE" >> $env:GITHUB_ENV
      - name: Install Python B2 qualification dependencies
        run: |
          python -m pip install -e "./python[flet,test,studio,ui-test]"
          python -m pip check
      - name: Linux numerical and desktop test toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y             cmake gfortran libblas-dev liblapack-dev             libgl1 libegl1 libgl1-mesa-dri libgles2             libgtk-3-0 libsecret-1-0             libxkbcommon-x11-0 libxcb-cursor0
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc-fortran mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-openblas
      - name: Linux Release build + all CTest
        if: runner.os == 'Linux'
        run: |
          cmake -S fortran -B build-b2 -DCMAKE_BUILD_TYPE=Release
          cmake --build build-b2 --parallel 2
          ctest --test-dir build-b2 --output-on-failure
          echo "DRMROTOR_LIB=$GITHUB_WORKSPACE/build-b2/libdrmrotor.so" >> "$GITHUB_ENV"
          echo "DRMBEARINGS_LIB=$GITHUB_WORKSPACE/build-b2/libdrmbearings.so" >> "$GITHUB_ENV"
      - name: Windows Release build + all CTest
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake -S fortran -B build-b2 -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_Fortran_COMPILER=/ucrt64/bin/gfortran.exe -DCMAKE_PREFIX_PATH=/ucrt64 -DBLA_VENDOR=OpenBLAS
          cmake --build build-b2 --parallel 2
          ctest --test-dir build-b2 --output-on-failure
          echo "DRMROTOR_LIB=$(cygpath -w "$PWD/build-b2/libdrmrotor.dll")" >> "$GITHUB_ENV"
          echo "DRMBEARINGS_LIB=$(cygpath -w "$PWD/build-b2/libdrmbearings.dll")" >> "$GITHUB_ENV"
          echo "DRMROTOR_DLL_DIRS=$(cygpath -w /ucrt64/bin)" >> "$GITHUB_ENV"
          cygpath -w /ucrt64/bin >> "$GITHUB_PATH"
      - name: Frozen B2 global/modal/Campbell parity and scope gates
        run: |
          python -m pytest python/tests_6dof_global --collect-only -q
          python -m pytest python/tests_6dof_global -q --junitxml=b2-native-parity.xml
      - name: Export exact-head B2 native engineering evidence
        run: python validation/b2/native_evidence.py --out b2-native-evidence
      - name: B1 numerical/ABI regression and promoted-byte preservation
        shell: bash
        run: |
          python -m pytest             python/tests_6dof_elements/test_contract.py             python/tests_6dof_elements/test_parity.py             -q --junitxml=b1-regression.xml
          python validation/b2/preservation.py
          git diff --exit-code d9be588c71bfd7116f61d1f5f5be3a2ee0e06726 HEAD -- validation/ross_parity/6dof_global
      - name: Same-head inherited A0-A8 bearings Qt and Flet regressions
        shell: bash
        run: |
          python -m pytest \
            python/tests_time python/tests_forced python/tests_frf python/tests_static python/tests \
            python/tests_level1 python/tests_api617_unbalance python/tests_clearance \
            python/tests_bearings python/tests_ui python/tests_flet \
            -q --junitxml=b2-inherited-regressions.xml
          python -m pytest python/tests_ucs \
            --ignore=python/tests_ucs/test_ucs_bearing_order_authority.py \
            -q --junitxml=b2-a5-main-regression.xml
          python -m pytest python/tests_ucs/test_ucs_bearing_order_authority.py \
            -k "additive_frozen_ross_native_parity_and_matrix_first or actual_fortran_permutation_save_reopen_and_model_immutability" \
            -q --junitxml=b2-a5-corrective-runtime.xml
          python scripts/flet_screen_inventory.py --out b2-flet-screen-inventory.json
          python - <<'PY'
          import json
          d=json.load(open("b2-flet-screen-inventory.json",encoding="utf-8"))
          assert d["status"]=="MAPPED"
          assert d["qt_presentation_classes"]==42
          assert d["native_contracts"]==21
          print("B2_FLET_INVENTORY=PASS 42/21")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b2-native-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            b2-native-parity.xml
            b2-native-evidence/
            b1-regression.xml
            b2-inherited-regressions.xml
            b2-a5-main-regression.xml
            b2-a5-corrective-runtime.xml
            b2-flet-screen-inventory.json
          if-no-files-found: error
          retention-days: 90
