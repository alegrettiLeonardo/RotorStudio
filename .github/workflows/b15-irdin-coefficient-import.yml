name: B15 iRdin Coefficient Import

on:
  push:
    branches:
      - feature/b13-b18-advanced-bearing-productization-20260926
  pull_request:
    branches:
      - feature/ross-bearings-rotorstudio-20260925
      - main
  workflow_dispatch:

concurrency:
  group: b15-irdin-import-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-b15:
    name: Linux B15 source qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: ${{ github.workspace }}/python/src:${{ github.workspace }}
      DRMROTOR_LIB: ${{ github.workspace }}/build-b15/libdrmrotor.so
      DRMBEARINGS_LIB: ${{ github.workspace }}/build-b15/libdrmbearings.so
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify B14 qualified ancestry
        run: |
          git merge-base --is-ancestor 111320fbfa80dbbcba8754dbf5bd09d9c4a8ceec HEAD
          git rev-parse HEAD
      - name: Install native and Qt dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gfortran cmake libblas-dev liblapack-dev libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './python[test,studio,ui-test]'
      - name: Build Release and native tests
        run: |
          cmake -S fortran -B build-b15 -DCMAKE_BUILD_TYPE=Release
          cmake --build build-b15 -j2
          ctest --test-dir build-b15 --output-on-failure
      - name: Stage 1 remains exactly 57
        run: |
          set -o pipefail
          mkdir -p validation/reports/b15/linux
          python -m pytest python/tests --collect-only -q | tee validation/reports/b15/linux/stage1_collection.txt
          grep -Eq '57 tests collected|57 collected' validation/reports/b15/linux/stage1_collection.txt
          python -m pytest python/tests -q | tee validation/reports/b15/linux/stage1_pytest.txt
      - name: B15 real iRdin coefficient-table gates
        run: |
          set -o pipefail
          python -m pytest python/tests_bearings/test_b15_irdin_coefficient_import.py python/tests_ui/test_core_irdin_import.py -q | tee validation/reports/b15/linux/b15.txt
      - name: B14 and B12 regression
        run: |
          set -o pipefail
          python -m pytest python/tests_bearings/test_b14_async_fields.py python/tests_ui/test_ui_b14_async_fields.py -q | tee validation/reports/b15/linux/b14_regression.txt
          python -m pytest python/tests_bearings/test_advanced_bearings.py python/tests_bearings/test_advanced_bearings_parity.py -q | tee validation/reports/b15/linux/b12_regression.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b15-linux-${{ github.sha }}
          path: validation/reports/b15/linux/
          if-no-files-found: error
          retention-days: 90

  windows-b15:
    name: Windows B15 source qualification
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify B14 qualified ancestry
        shell: pwsh
        run: |
          git merge-base --is-ancestor 111320fbfa80dbbcba8754dbf5bd09d9c4a8ceec HEAD
          if ($LASTEXITCODE -ne 0) { throw "B15 ancestry failed" }
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc-fortran
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-openblas
      - name: Record UCRT64 runtime
        shell: msys2 {0}
        run: echo "UCRT64_BIN=$(cygpath -w /ucrt64/bin)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './python[test,studio,ui-test]'
      - name: Build Release
        shell: msys2 {0}
        run: |
          cmake -S fortran -B build-b15 -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_Fortran_COMPILER=/ucrt64/bin/gfortran.exe -DCMAKE_PREFIX_PATH=/ucrt64 -DBLA_VENDOR=OpenBLAS
          cmake --build build-b15 --parallel
          ctest --test-dir build-b15 --output-on-failure
      - name: Locate native DLLs
        shell: pwsh
        run: |
          $rotor=Get-ChildItem ./build-b15 -Recurse -Filter "*drmrotor*.dll" | Select-Object -First 1
          $bear=Get-ChildItem ./build-b15 -Recurse -Filter "*drmbearings*.dll" | Select-Object -First 1
          if (-not $rotor -or -not $bear) { throw "native DLL missing" }
          $root=(Get-Location).Path
          "DRMROTOR_LIB=$($rotor.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "DRMBEARINGS_LIB=$($bear.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "DRMROTOR_DLL_DIRS=$env:UCRT64_BIN" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "DRMBEARINGS_DLL_DIRS=$env:UCRT64_BIN" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PYTHONPATH=$root/python/src;$root" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: B15 and regression gates
        shell: pwsh
        run: |
          $env:PATH="$env:UCRT64_BIN;$env:PATH"
          New-Item -ItemType Directory -Force validation/reports/b15/windows | Out-Null
          $collection=python -m pytest python/tests --collect-only -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $collection | Tee-Object validation/reports/b15/windows/stage1_collection.txt
          if (-not ($collection -match '57 tests collected|57 collected')) { throw "Stage 1 collection is not 57" }
          python -m pytest python/tests -q | Tee-Object validation/reports/b15/windows/stage1_pytest.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest python/tests_bearings/test_b15_irdin_coefficient_import.py python/tests_ui/test_core_irdin_import.py -q | Tee-Object validation/reports/b15/windows/b15.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest python/tests_bearings/test_b14_async_fields.py python/tests_bearings/test_advanced_bearings.py -q | Tee-Object validation/reports/b15/windows/regression.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b15-windows-${{ github.sha }}
          path: validation/reports/b15/windows/
          if-no-files-found: error
          retention-days: 90

  b15-gate:
    name: B15 aggregate gate
    needs: [linux-b15, windows-b15]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require Linux and Windows
        env:
          LINUX_RESULT: ${{ needs.linux-b15.result }}
          WINDOWS_RESULT: ${{ needs.windows-b15.result }}
        run: |
          test "$LINUX_RESULT" = "success"
          test "$WINDOWS_RESULT" = "success"
      - name: Final B15 label
        run: |
          echo "B15_IRDIN_COEFFICIENT_BEARING_IMPORT = PASS"
          echo "HEAD = $GITHUB_SHA"
