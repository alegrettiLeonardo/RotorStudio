name: B20 Coaxial Advanced Bearings

on:
  push:
    branches:
      - feature/b19-b23-advanced-bearing-extensions-20260927
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: b20-coaxial-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-b20:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONPATH: ${{ github.workspace }}/python/src:${{ github.workspace }}
      DRMROTOR_LIB: ${{ github.workspace }}/build-b20/libdrmrotor.so
      DRMBEARINGS_LIB: ${{ github.workspace }}/build-b20/libdrmbearings.so
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Verify B19 ancestry
        run: git merge-base --is-ancestor e5311ad3168d3906e2cba6a6a1f5c0f626d4961d HEAD
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y gfortran cmake libblas-dev liblapack-dev
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e './python[test]'
      - run: |
          cmake -S fortran -B build-b20 -DCMAKE_BUILD_TYPE=Release
          cmake --build build-b20 -j2
          ctest --test-dir build-b20 --output-on-failure
      - name: B20 gates
        run: |
          python -m pytest python/tests_bearings/test_b20_coaxial_advanced.py python/tests/test_coaxial_source_oracle.py -q -s
          python -m pytest python/tests_bearings/test_b19_nonzero_bearing_mass.py -q

  windows-b20:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc-fortran
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-openblas
      - name: Runtime path
        shell: msys2 {0}
        run: echo "UCRT64_BIN=$(cygpath -w /ucrt64/bin)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - shell: pwsh
        run: python -m pip install -e './python[test]'
      - name: Build
        shell: msys2 {0}
        run: |
          cmake -S fortran -B build-b20 -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_Fortran_COMPILER=/ucrt64/bin/gfortran.exe -DCMAKE_PREFIX_PATH=/ucrt64 -DBLA_VENDOR=OpenBLAS
          cmake --build build-b20 --parallel
          ctest --test-dir build-b20 --output-on-failure
      - name: B20 gates
        shell: pwsh
        run: |
          $rotor=Get-ChildItem ./build-b20 -Recurse -Filter "*drmrotor*.dll" | Select-Object -First 1
          $bear=Get-ChildItem ./build-b20 -Recurse -Filter "*drmbearings*.dll" | Select-Object -First 1
          $root=(Get-Location).Path
          $env:DRMROTOR_LIB=$rotor.FullName;$env:DRMBEARINGS_LIB=$bear.FullName
          $env:DRMROTOR_DLL_DIRS=$env:UCRT64_BIN;$env:DRMBEARINGS_DLL_DIRS=$env:UCRT64_BIN
          $env:PATH="$env:UCRT64_BIN;$env:PATH";$env:PYTHONPATH="$root/python/src;$root"
          python -m pytest python/tests_bearings/test_b20_coaxial_advanced.py python/tests/test_coaxial_source_oracle.py -q -s
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  b20-gate:
    needs: [linux-b20, windows-b20]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: |
          test "${{ needs.linux-b20.result }}" = "success"
          test "${{ needs.windows-b20.result }}" = "success"
          echo "B20_COAXIAL_ADVANCED_BEARINGS = PASS"
