name: Flet expansion bootstrap

on:
  push:
    branches:
      - feat/flet-mockup-interface-20260929
    paths:
      - '.github/flet-expansion.patch'
      - '.github/workflows/flet-expansion-bootstrap.yml'

permissions:
  contents: write

concurrency:
  group: flet-expansion-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish exact expanded Flet source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify reconciliation base and patch
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor fcdac252974aeeded6961dbe3310677e234a6495 HEAD
          echo "716c30d5cde954916cc01bf4e0d076db55639f9d35cf43a825108909e4472c27  .github/flet-expansion.patch" | sha256sum -c -
          git apply --check --whitespace=error .github/flet-expansion.patch

      - name: Apply exact expansion and remove bootstrap payload
        shell: bash
        run: |
          set -euo pipefail
          git apply --index --whitespace=error .github/flet-expansion.patch
          git rm -r .github/flet_patch_parts
          git rm .github/flet-expansion.patch
          git rm .github/workflows/flet-expansion-bootstrap.yml
          git diff --cached --exit-code fcdac252974aeeded6961dbe3310677e234a6495 -- fortran python/src/drm_core python/src/drm_studio
          test "$(git diff --cached --name-only fcdac252974aeeded6961dbe3310677e234a6495 | wc -l)" -eq 43

      - name: Commit expanded Flet interface
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(flet): complete RotorStudio screen migration and distribution qualification'
          git push origin HEAD:feat/flet-mockup-interface-20260929
