name: ROSS Bearing Golden Reference Generator

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/generate_ross_golden_cases.py"
      - ".github/workflows/ross-bearing-golden-reference.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-ross-6320eab9:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Checkout pinned ROSS authority
        uses: actions/checkout@v4
        with:
          repository: petrobras/ross
          ref: 6320eab9f890f1b3cc1710d508b446fe063ca68d
          path: _ross_ref
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned ROSS
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./_ross_ref

      - name: Snapshot checked-in golden references
        run: |
          cp -a tests/reference/ross_6320eab9 /tmp/ross_6320eab9_checked

      - name: Generate B12 golden cases
        run: |
          python scripts/generate_ross_golden_cases.py \
            --ross-root ./_ross_ref \
            --out tests/reference/ross_6320eab9

      - name: Record authority
        run: |
          test "$(git -C _ross_ref rev-parse HEAD)" = "6320eab9f890f1b3cc1710d508b446fe063ca68d"
          cat tests/reference/ross_6320eab9/manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: ross-6320eab9-bearing-golden-cases
          path: tests/reference/ross_6320eab9/
          if-no-files-found: error
          retention-days: 90

      - name: Verify checked-in golden references are numerically reproducible
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np

          old = Path("/tmp/ross_6320eab9_checked")
          new = Path("tests/reference/ross_6320eab9")

          def scrub(value):
              if isinstance(value, dict):
                  return {k: scrub(v) for k, v in value.items() if "sha256" not in k}
              if isinstance(value, list):
                  return [scrub(v) for v in value]
              return value

          def compare(a, b, path="root"):
              if isinstance(a, dict):
                  assert set(a) == set(b), (path, set(a) ^ set(b))
                  for k in a:
                      compare(a[k], b[k], f"{path}.{k}")
              elif isinstance(a, list):
                  assert len(a) == len(b), (path, len(a), len(b))
                  for i, (x, y) in enumerate(zip(a, b)):
                      compare(x, y, f"{path}[{i}]")
              elif isinstance(a, (int, float)) and isinstance(b, (int, float)):
                  assert np.isclose(float(a), float(b), rtol=5e-13, atol=1e-12), (path, a, b)
              else:
                  assert a == b, (path, a, b)

          for old_json in sorted(old.glob("*.json")):
              new_json = new / old_json.name
              compare(
                  scrub(json.loads(old_json.read_text(encoding="utf-8"))),
                  scrub(json.loads(new_json.read_text(encoding="utf-8"))),
                  old_json.name,
              )

          for old_npz in sorted(old.glob("*.npz")):
              new_npz = new / old_npz.name
              with np.load(old_npz) as a, np.load(new_npz) as b:
                  assert set(a.files) == set(b.files), old_npz.name
                  for key in a.files:
                      np.testing.assert_allclose(a[key], b[key], rtol=5e-13, atol=1e-12)

          print("Checked-in golden references reproduce pinned ROSS numerically;")
          print("last-bit platform noise is excluded from the gate.")
          PY
