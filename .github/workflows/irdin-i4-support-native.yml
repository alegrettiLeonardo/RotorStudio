name: iRdin I4 Native Support Element Qualification

on:
  push:
    branches: [feature/irdin-api541-dynamics]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/python/src:${{ github.workspace }}
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python dependencies
        run: |
          python -m pip install -e "./python[test]"
          python -m pip check
      - name: Linux native dependencies and build
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gfortran libblas-dev liblapack-dev
          cmake -S fortran -B build-i4 -DCMAKE_BUILD_TYPE=Release
          cmake --build build-i4 --parallel 2
          ctest --test-dir build-i4 --output-on-failure
          echo "DRMROTOR_LIB=${{ github.workspace }}/build-i4/libdrmrotor.so" >> "$GITHUB_ENV"
          echo "DRMBEARINGS_LIB=${{ github.workspace }}/build-i4/libdrmbearings.so" >> "$GITHUB_ENV"
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc-fortran mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-openblas
      - name: Windows native build
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cmake -S fortran -B build-i4 -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_Fortran_COMPILER=/ucrt64/bin/gfortran.exe -DCMAKE_PREFIX_PATH=/ucrt64 -DBLA_VENDOR=OpenBLAS
          cmake --build build-i4 --parallel 2
          ctest --test-dir build-i4 --output-on-failure
          echo "DRMROTOR_LIB=$(cygpath -w "$PWD/build-i4/libdrmrotor.dll")" >> "$GITHUB_ENV"
          echo "DRMBEARINGS_LIB=$(cygpath -w "$PWD/build-i4/libdrmbearings.dll")" >> "$GITHUB_ENV"
          echo "DRMROTOR_DLL_DIRS=$(cygpath -w /ucrt64/bin)" >> "$GITHUB_ENV"
          echo "DRMBEARINGS_DLL_DIRS=$(cygpath -w /ucrt64/bin)" >> "$GITHUB_ENV"
          cygpath -w /ucrt64/bin >> "$GITHUB_PATH"
      - name: Immutable import authority
        run: python validation/irdin/i0_authority.py --verify
      - name: I0-I4 and inherited kernel regressions
        run: python -m pytest python/tests_irdin python/tests_6dof_elements python/tests -q --junitxml=irdin-i4-${{ runner.os }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: irdin-i4-${{ runner.os }}-${{ github.sha }}
          path: irdin-i4-${{ runner.os }}.xml
          if-no-files-found: error
          retention-days: 30
