name: Unpack Stage 1 M2 source

on:
  push:
    branches:
      - stage1-m2-fortran-python
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: stage1-m2-fortran-python
          fetch-depth: 0

      - name: Reconstruct and verify exact source snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat artifacts/RotorStudio_Stage1_M2_source.tar.gz.part* > /tmp/RotorStudio_Stage1_M2_source.tar.gz
          echo "03b68d3cea9555665ab26eb6f3b2c895d3df7970a3a350419ee3aa12ced34c1d  /tmp/RotorStudio_Stage1_M2_source.tar.gz" | sha256sum -c -

      - name: Unpack source into repository
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/RotorStudio_Stage1_M2_source.tar.gz -C .
          rm -f artifacts/RotorStudio_Stage1_M2_source.tar.gz.part*
          rm -f artifacts/reconstruct_stage1_m2_source.sh
          rm -f .github/workflows/unpack-stage1-m2-source.yml

      - name: Commit unpacked source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: materialize Stage 1 M2 source tree"
          git push origin HEAD:stage1-m2-fortran-python
