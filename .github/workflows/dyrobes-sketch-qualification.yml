name: DyRoBeS Rotor Sketch Qualification

on:
  push:
    branches:
      - feature/dyrobes-rotor-sketch-legacy-test
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: dyrobes-sketch-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sketch-linux:
    name: Real Cryostar sketch + regression
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: ${{ github.workspace }}/python/src:${{ github.workspace }}
      DRMROTOR_LIB: ${{ github.workspace }}/build-dyrobes/libdrmrotor.so
      DRMBEARINGS_LIB: ${{ github.workspace }}/build-dyrobes/libdrmbearings.so
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install numerical and Qt dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gfortran cmake libblas-dev liblapack-dev libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install RotorStudio
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './python[test,studio,ui-test]'

      - name: Assert legacy Fortran core remains frozen
        run: |
          mkdir -p validation/reports/dyrobes_sketch
          {
            echo "DyRoBeS legacy freeze baseline: 9f9f6616fb5bfac8894235ae27d4e58fe97e23e7"
            echo "Exception: fortran/bearings/** and the libdrmbearings CMake target are intentionally outside this legacy gate."
            echo
            echo "Legacy fortran/src diff:"
            git diff --stat 9f9f6616fb5bfac8894235ae27d4e58fe97e23e7 -- fortran/src
            echo
            echo "Legacy fortran/tests diff:"
            git diff --stat 9f9f6616fb5bfac8894235ae27d4e58fe97e23e7 -- fortran/tests
          } | tee validation/reports/dyrobes_sketch/fortran_diff.txt
          test -z "$(git diff --name-only 9f9f6616fb5bfac8894235ae27d4e58fe97e23e7 -- fortran/src fortran/tests)"

      - name: Build qualified Fortran core
        run: |
          cmake -S fortran -B build-dyrobes -DCMAKE_BUILD_TYPE=Release
          cmake --build build-dyrobes -j2
          ctest --test-dir build-dyrobes --output-on-failure

      - name: Frozen Stage 1 regression
        run: |
          set -o pipefail
          python -m pytest python/tests --collect-only -q | tee validation/reports/dyrobes_sketch/stage1_collection.txt
          grep -Eq '57 tests collected|57 collected' validation/reports/dyrobes_sketch/stage1_collection.txt
          python -m pytest python/tests -q | tee validation/reports/dyrobes_sketch/stage1_pytest.txt

      - name: Full desktop UI regression including real Cryostar importer
        run: |
          set -o pipefail
          python -m pytest python/tests_ui -q | tee validation/reports/dyrobes_sketch/ui_pytest.txt
          if grep -Eqi '[1-9][0-9]* skipped' validation/reports/dyrobes_sketch/ui_pytest.txt; then
            echo "DyRoBeS sketch qualification must not skip real-Fortran UI tests" >&2
            exit 1
          fi

      - name: Capture real Cryostar RotorStudio sketch
        run: |
          python scripts/capture_dyrobes_sketch.py --outdir validation/reports/dyrobes_sketch/screenshots
          test -s validation/reports/dyrobes_sketch/screenshots/cryostar_rotorstudio.png
          test -s validation/reports/dyrobes_sketch/screenshots/cryostar_dyrobes_sketch.png

      - name: Record qualification evidence
        run: |
          python - <<'PY'
          import json, os, pathlib
          out = pathlib.Path("validation/reports/dyrobes_sketch")
          screenshots = {
              p.name: p.stat().st_size
              for p in sorted((out / "screenshots").glob("*.png"))
          }
          payload = {
              "status": "PASS",
              "head_sha": os.environ["GITHUB_SHA"],
              "stage1": "57/57 PASS",
              "fortran_diff": "LEGACY_CORE_ZERO; fortran/bearings exception documented",
              "real_fixture": "EST-12735185-CRYOSTAR_V2.txt",
              "sketch_style": "DyRoBeS reference",
              "numerical_status": "BLOCKED_FOR_NUMERICAL_ANALYSIS by design",
              "screenshots": screenshots,
          }
          (out / "DYROBES_SKETCH_QUALIFICATION.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True)
          )
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Upload sketch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dyrobes-sketch-${{ github.sha }}
          path: validation/reports/dyrobes_sketch/
          if-no-files-found: error
          retention-days: 90
