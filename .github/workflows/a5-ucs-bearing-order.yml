name: A5 UCS Bearing Order Regression Qualification
on:
  push:
    branches: [fix/a5-ucs-bearing-order-authority-20260929]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-bearing-order:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: offscreen
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python dependencies
        run: python -m pip install -e "./python[test,studio,ui-test]"
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y gfortran cmake libblas-dev liblapack-dev libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc-fortran mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-openblas
      - name: Linux Release and ALL CTest
        if: runner.os == 'Linux'
        run: |
          cmake -S fortran -B build-a5-order -DCMAKE_BUILD_TYPE=Release
          cmake --build build-a5-order -j2
          ctest --test-dir build-a5-order --output-on-failure
          echo "DRMROTOR_LIB=$PWD/build-a5-order/libdrmrotor.so" >> "$GITHUB_ENV"
          echo "DRMBEARINGS_LIB=$PWD/build-a5-order/libdrmbearings.so" >> "$GITHUB_ENV"
          echo "PYTHONPATH=$PWD/python/src:$PWD" >> "$GITHUB_ENV"
      - name: Windows Release and ALL CTest
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake -S fortran -B build-a5-order -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_Fortran_COMPILER=/ucrt64/bin/gfortran.exe -DCMAKE_PREFIX_PATH=/ucrt64 -DBLA_VENDOR=OpenBLAS
          cmake --build build-a5-order --parallel
          ctest --test-dir build-a5-order --output-on-failure
          echo "DRMROTOR_DLL_DIRS=$(cygpath -w /ucrt64/bin)" >> "$GITHUB_ENV"
          echo "DRMBEARINGS_DLL_DIRS=$(cygpath -w /ucrt64/bin)" >> "$GITHUB_ENV"
      - name: Windows library paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dll = Get-ChildItem build-a5-order -Recurse -Filter '*drmrotor*.dll' | Select-Object -First 1
          $bearing = Get-ChildItem build-a5-order -Recurse -Filter '*drmbearings*.dll' | Select-Object -First 1
          "DRMROTOR_LIB=$($dll.FullName)" >> $env:GITHUB_ENV
          "DRMBEARINGS_LIB=$($bearing.FullName)" >> $env:GITHUB_ENV
          "PYTHONPATH=$PWD\python\src;$PWD" >> $env:GITHUB_ENV
      - name: Actual native sentinel before assertions
        shell: python
        run: |
          import sys, json
          from pathlib import Path
          import numpy as np
          sys.path.insert(0, 'python/tests_ucs')
          from test_ucs_bearing_order import bearing_pair, make_model, validated
          from drm_core import run_ucs
          low, high = bearing_pair('legacy3')
          model = make_model('legacy3', [high, low])
          before = model.model_hash()
          supports, family, _ = validated(model)
          r = run_ucs(model, (6,10), num=7, num_modes=16)
          def encode(x):
              if isinstance(x,np.ndarray): return x.tolist()
              if isinstance(x,np.generic): return x.item()
              raise TypeError(type(x).__name__)
          data = {'expected_node': 1, 'actual_node': supports[0].node,
                  'insertion_order': [b.node for b in model.bearings],
                  'model_hash_before': before, 'model_hash_after': model.model_hash(),
                  'result': vars(r)}
          Path('order-evidence').mkdir(exist_ok=True)
          Path('order-evidence/native_sentinel.json').write_text(json.dumps(data,default=encode,indent=2), encoding='utf-8')
          print(json.dumps({'expected_node':1,'actual_node':supports[0].node,
                'Kxx':r.bearing_kxx_n_m.tolist(),'Kyy':r.bearing_kyy_n_m.tolist(),
                'families':r.coefficient_families,'speed_policy':r.bearing_speed_policy,
                'intersection_k':r.intersection_stiffness_n_m.tolist(),
                'intersection_speed':r.intersection_speed_rad_s.tolist(),
                'model_unchanged':before==model.model_hash()},indent=2))
      - name: All prepared binding AND actual Fortran tests - no deselection
        run: python -m pytest python/tests_ucs/test_ucs_bearing_order.py -vv --junitxml=order-evidence/targeted.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a5-order-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: order-evidence/
          if-no-files-found: warn
