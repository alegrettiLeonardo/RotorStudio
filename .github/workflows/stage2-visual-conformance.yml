name: Stage 2.1 Visual Conformance

on:
  push:
    branches:
      - feature/stage2.1-visual-conformance
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: stage21-visual-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-linux:
    name: Visual layout + real 3D mode shape
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: ${{ github.workspace }}/python/src:${{ github.workspace }}
      DRMROTOR_LIB: ${{ github.workspace }}/build-stage21/libdrmrotor.so
      DRMBEARINGS_LIB: ${{ github.workspace }}/build-stage21/libdrmbearings.so
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install numerical and Qt dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gfortran cmake libblas-dev liblapack-dev libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install Core + Studio
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './python[test,studio,ui-test]'

      - name: Assert Stage 2.1 does not modify qualified legacy Fortran core
        run: |
          mkdir -p validation/reports/stage21
          git diff --stat a20385319f550761e62c02ca5f5f6a21923b610e -- fortran/src fortran/tests | tee validation/reports/stage21/legacy_fortran_core_diff.txt
          test -z "$(git diff --name-only a20385319f550761e62c02ca5f5f6a21923b610e -- fortran/src fortran/tests)"
          echo "Additive fortran/bearings is outside the frozen Stage 2.1 legacy-core boundary and has its own qualification." | tee validation/reports/stage21/additive_bearings_note.txt

      - name: Build qualified Fortran core
        run: |
          cmake -S fortran -B build-stage21 -DCMAKE_BUILD_TYPE=Release
          cmake --build build-stage21 -j2
          ctest --test-dir build-stage21 --output-on-failure

      - name: Stage 1 regression
        run: |
          set -o pipefail
          python -m pytest python/tests --collect-only -q | tee validation/reports/stage21/stage1_collection.txt
          grep -Eq '57 tests collected|57 collected' validation/reports/stage21/stage1_collection.txt
          python -m pytest python/tests -q | tee validation/reports/stage21/stage1_pytest.txt

      - name: Complete UI tests including visual conformance
        run: |
          set -o pipefail
          python -m pytest python/tests_ui -q | tee validation/reports/stage21/ui_pytest.txt
          if grep -Eqi '[1-9][0-9]* skipped' validation/reports/stage21/ui_pytest.txt; then
            echo "Stage 2.1 qualification must not skip real-Fortran tests" >&2
            exit 1
          fi

      - name: Generate real application screenshots
        run: |
          python scripts/capture_stage2_ui.py --outdir validation/reports/stage21/screenshots
          for f in rotor_model.png campbell_results.png bearing_seal_editor.png mode_shape_3d.png frequency_response.png runup_transient.png; do
            test -s "validation/reports/stage21/screenshots/$f"
          done

      - name: Record visual evidence
        run: |
          python - <<'PY'
          import json, os, pathlib
          outdir=pathlib.Path("validation/reports/stage21/screenshots")
          payload={
            "status":"PASS",
            "head_sha":os.environ["GITHUB_SHA"],
            "legacy_fortran_core_diff":"ZERO",
            "advanced_bearing_fortran":"QUALIFIED_SEPARATELY",
            "stage1":"57/57 PASS",
            "visual_tests":"PASS",
            "screenshots":{p.name:p.stat().st_size for p in sorted(outdir.glob("*.png"))},
            "required_tabs":["Campbell","Root Locus","Modes","Orbits","FRF","+"],
            "mode_shape_3d":"real ModalResult eigenvector; red centerline + magenta whirl orbits + black reference",
          }
          pathlib.Path("validation/reports/stage21/STAGE21_VISUAL.json").write_text(json.dumps(payload,indent=2,sort_keys=True))
          print(json.dumps(payload,indent=2,sort_keys=True))
          PY

      - name: Upload Stage 2.1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage21-visual-${{ github.sha }}
          path: validation/reports/stage21/
          if-no-files-found: error
          retention-days: 90
