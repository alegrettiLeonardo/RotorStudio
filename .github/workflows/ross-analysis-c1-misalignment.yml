name: ROSS Analysis C1 Misalignment Qualification

on:
  push:
    branches: [feature/ross-analysis-c1-misalignment]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONHASHSEED: '0'

jobs:
  native:
    name: C1 native misalignment / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Set deterministic Git bytes
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran libopenblas-dev ninja-build
      - name: Windows native dependencies
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc-fortran
            mingw-w64-ucrt-x86_64-openblas
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Python dependencies
        run: |
          python -m pip install -e ./python pytest numpy
          python -m pip check
      - name: Configure and build Linux
        if: runner.os == 'Linux'
        run: |
          cmake -S fortran -B build-c1 -G Ninja -DCMAKE_BUILD_TYPE=Release -DBLA_VENDOR=OpenBLAS
          cmake --build build-c1 --parallel 2
          ctest --test-dir build-c1 --output-on-failure
          echo "DRMROTOR_LIB=$GITHUB_WORKSPACE/build-c1/libdrmrotor.so" >> "$GITHUB_ENV"
      - name: Configure and build Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake -S fortran -B build-c1 -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_Fortran_COMPILER=/ucrt64/bin/gfortran.exe -DCMAKE_PREFIX_PATH=/ucrt64 -DBLA_VENDOR=OpenBLAS
          cmake --build build-c1 --parallel 2
          ctest --test-dir build-c1 --output-on-failure
          echo "DRMROTOR_LIB=$(cygpath -w "$PWD/build-c1/libdrmrotor.dll")" >> "$GITHUB_ENV"
          echo "DRMROTOR_DLL_DIRS=C:\\msys64\\ucrt64\\bin" >> "$GITHUB_ENV"
      - name: C1 frozen parity and independent gates
        run: |
          python -m pytest python/tests_misalignment -q --junitxml=c1-evidence/c1-tests.xml
      - name: B3 direct regression
        run: |
          python -m pytest python/tests_axial_torsional -q --junitxml=c1-evidence/b3-regression.xml
      - name: B2 direct regression
        run: |
          python -m pytest python/tests_6dof_global -q --junitxml=c1-evidence/b2-regression.xml
      - name: Frozen authority immutability
        run: |
          git diff --exit-code b45bbaa5ec91ca004643142e83f75d0c13f7a8ea HEAD -- validation/ross_parity/misalignment
          test -z "$(git status --porcelain --untracked-files=all validation/ross_parity/misalignment)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c1-native-${{ matrix.os }}-${{ github.sha }}
          path: c1-evidence/
          if-no-files-found: warn
          retention-days: 90

  aggregate:
    name: C1 exact-head aggregate
    needs: native
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require Linux and Windows
        env:
          RESULT: ${{ needs.native.result }}
        run: test "$RESULT" = success
